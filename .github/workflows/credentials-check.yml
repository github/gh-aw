name: Credentials Check
on:
  workflow_dispatch:
    inputs:
      agy-only:
        description: Run only the experimental Agy authentication gate
        type: boolean
        default: false
      agy-model:
        description: Native Agy model slug for the authentication probe
        type: string
        default: gemini-3.8-flash-medium
      agy-conformance:
        description: Run only the experimental Agy production AWF conformance gate
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ (inputs['agy-only'] || inputs['agy-conformance']) && format('credentials-check-agy-{0}', github.ref) || 'credentials-check' }}
  cancel-in-progress: true
jobs:
  claude:
    if: ${{ !inputs['agy-only'] && !inputs['agy-conformance'] }}
    name: Claude credential check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.237
      - name: Generate haiku
        run: claude -p --bare --tools "" --max-budget-usd 1 "Write a haiku about credentials in fewer than 100 tokens."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  codex:
    if: ${{ !inputs['agy-only'] && !inputs['agy-conformance'] }}
    name: Codex credential check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - name: Install Codex
        run: npm install -g @openai/codex@0.148.0
      - name: Generate haiku
        run: |
          # Codex's built-in "openai" model provider cannot have `supports_websockets`
          # overridden via `-c` (built-in provider IDs are reserved), and the Responses
          # WebSocket transport has a known upstream bug where the handshake can be
          # rejected with a 401 even for valid credentials
          # (see https://github.com/openai/codex/issues/39578 and
          # https://github.com/openai/codex/issues/38638). Work around it the same way
          # the gh-aw Codex engine does for its own proxy provider: define a custom
          # provider that talks to the same OpenAI endpoint with WebSockets disabled so
          # only the HTTPS transport is used.
          mkdir -p /tmp/codex-home
          cat > /tmp/codex-home/config.toml << 'EOF'
          model_provider = "openai-direct"

          [model_providers.openai-direct]
          name = "OpenAI"
          base_url = "https://api.openai.com/v1"
          env_key = "OPENAI_API_KEY"
          supports_websockets = false
          EOF
          codex exec --skip-git-repo-check --sandbox read-only --ephemeral --ignore-rules "Write a haiku about credentials in fewer than 100 tokens. Do not use tools."
        env:
          CODEX_HOME: /tmp/codex-home
          OPENAI_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
  copilot-github-token:
    if: ${{ !inputs['agy-only'] && !inputs['agy-conformance'] }}
    name: Copilot GitHub Actions token check
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Generate haiku
        run: copilot --available-tools "" --disable-builtin-mcps --no-custom-instructions --max-ai-credits 100 --prompt "Write a haiku about credentials in fewer than 100 tokens."
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
  copilot-pat:
    if: ${{ !inputs['agy-only'] && !inputs['agy-conformance'] }}
    name: Copilot PAT credential check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Generate haiku
        run: copilot --available-tools "" --disable-builtin-mcps --no-custom-instructions --max-ai-credits 100 --prompt "Write a haiku about credentials in fewer than 100 tokens."
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
  agy:
    name: Experimental Agy native authentication gate
    if: ${{ inputs['agy-only'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Test authentication probe
        run: node --test scripts/agy-authentication.test.cjs
      - name: Install checksum-verified native Agy
        run: |
          set -euo pipefail
          umask 077
          directory="$RUNNER_TEMP/agy-auth-install"
          mkdir -p "$directory"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --max-time 120 \
            https://github.com/google-antigravity/antigravity-cli/releases/download/1.3.1/agy_cli_linux_x64.tar.gz \
            --output "$directory/agy.tar.gz"
          printf '%s  %s\n' \
            0e313b309ea58c71431ce86bb820936a3700e17e44eabce7bf2264617dc822db \
            "$directory/agy.tar.gz" | sha256sum --check --strict
          tar -xzf "$directory/agy.tar.gz" -C "$directory" -- antigravity
          install -m 755 "$directory/antigravity" "$directory/agy"
          test "$("$directory/agy" --version)" = "1.3.1"
      - name: Prove native API-key authentication
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGY_MODEL: ${{ inputs['agy-model'] }}
          AGY_BINARY: ${{ runner.temp }}/agy-auth-install/agy
          AGY_AUTH_EVIDENCE: ${{ runner.temp }}/agy-auth-evidence/report.json
        run: node scripts/agy-authentication.cjs
      - name: Upload sanitized authentication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agy-native-authentication
          path: ${{ runner.temp }}/agy-auth-evidence/report.json
          retention-days: 2
          if-no-files-found: error
  agy-conformance:
    if: ${{ inputs['agy-conformance'] }}
    name: Experimental Agy production conformance gate
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/engine-conformance-agy.lock.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
