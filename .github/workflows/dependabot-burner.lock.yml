          GH_AW_OTEL_METRICS: ""
          GH_AW_OTLP_ALL_HEADERS: ""
          GH_AW_OTLP_ENDPOINTS: ""
          GH_AW_OTLP_LOGS_ENABLED: ""
          GH_AW_OTLP_LOGS_MAX_BYTES: ""
          GH_AW_PROMPT: ${{ env.GH_AW_SETUP_ROOT }}/aw-prompts/prompt.txt
          GH_AW_PROMPT_ENV: "[\"GH_AW_EXPR_76DF9333\",\"GH_AW_EXPR_77C1A4D2\",\"GH_AW_EXPR_7C248226\",\"GH_AW_EXPR_C19C384F\",\"GH_AW_GITHUB_ACTOR\",\"GH_AW_GITHUB_REPOSITORY\",\"GH_AW_GITHUB_RUN_ID\",\"GH_AW_GITHUB_WORKSPACE\",\"GH_AW_INCLUDE_PR_CONTEXT\",\"GH_AW_MCP_CLI_SERVERS_LIST\",\"GH_AW_NEEDS_ACTIVATION_OUTPUTS_STEERING_ISSUE_NUMBER\",\"GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED\",\"GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_MATCHED_COMMAND\",\"GH_AW_PROMPT\"]"
          NODE_USE_SYSTEM_CA: ""
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_HEADERS: ""
          OTEL_EXPORTER_OTLP_PROTOCOL: ""
