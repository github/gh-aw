              GH_AW_TOOL_CACHE_MOUNT="$GH_AW_TOOL_CACHE:$GH_AW_TOOL_CACHE:ro"
            fi
          fi
          unset GH_AW_RUNTIME_TOKEN GH_AW_RUNTIME_ID GH_AW_SETUP_ID
          # shellcheck disable=SC1003,SC2016,SC2086
          awf --config "${GH_AW_SETUP_ROOT}/awf-config.json" --container-workdir "${GITHUB_WORKSPACE}" --mount "${GH_AW_SETUP_ROOT}:${GH_AW_SETUP_ROOT}:ro" --mount "${GH_AW_SETUP_ROOT}:/host${GH_AW_SETUP_ROOT}:ro" ${GH_AW_TOOL_CACHE_MOUNT:+--mount "$GH_AW_TOOL_CACHE_MOUNT"} ${GH_AW_DOCKER_HOST:+--docker-host "$GH_AW_DOCKER_HOST"} --env-all --exclude-env ACTIONS_ID_TOKEN_REQUEST_TOKEN --exclude-env ACTIONS_ID_TOKEN_REQUEST_URL --exclude-env COPILOT_GITHUB_TOKEN --exclude-env GH_AW_OTLP_ALL_HEADERS --exclude-env GH_AW_OTLP_ENDPOINTS --exclude-env OTEL_EXPORTER_OTLP_ENDPOINT --exclude-env OTEL_EXPORTER_OTLP_HEADERS --mount ${{ env.GH_AW_RUNTIME_ROOT }}:${{ env.GH_AW_RUNTIME_ROOT }}:rw --mount ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection:${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection:rw --log-level info --session-state-dir ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/agent/session-state --skip-pull \
            -- /bin/bash -c 'set +o histexpand; export PATH="${GH_AW_SETUP_ROOT}/bin:$PATH" && : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE must be set}"; GH_AW_TOOL_CACHE="$RUNNER_TOOL_CACHE"; GH_AW_TOOL_BINS="$(find "$GH_AW_TOOL_CACHE" -maxdepth 5 -type d -name bin 2>/dev/null | tr "\n" ":")"; GH_AW_TOOL_BINS="${GH_AW_TOOL_BINS%:}"; export PATH="$PATH${GH_AW_TOOL_BINS:+:}$GH_AW_TOOL_BINS"; [ -n "$GOROOT" ] && export PATH="$GOROOT/bin:$PATH" || true; [ -n "$ERLANG_HOME" ] && export PATH="$ERLANG_HOME/bin:$PATH" || true && threat-detect --engine copilot --output ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_result.json ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection-inputs' 2>&1 | tee -a ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection.log
      - name: Copy detection firewall logs
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        run: |
          mkdir -p ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall
          if [ -d ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/firewall/logs ]; then mkdir -p ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall/logs && cp -r ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/firewall/logs/. ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall/logs/; fi
          if [ -d ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/firewall/audit ]; then mkdir -p ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall/audit && cp -r ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/firewall/audit/. ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall/audit/; fi
      - name: Redact secrets in detection logs
        id: redact_detection_logs
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_SECRET_NAMES: 'GH_AW_OTEL_GRAFANA_AUTHORIZATION,GH_AW_OTEL_GRAFANA_ENDPOINT,GH_AW_OTEL_SENTRY_AUTHORIZATION,GH_AW_OTEL_SENTRY_ENDPOINT'
          SECRET_GH_AW_OTEL_GRAFANA_AUTHORIZATION: ${{ secrets.GH_AW_OTEL_GRAFANA_AUTHORIZATION }}
          SECRET_GH_AW_OTEL_GRAFANA_ENDPOINT: ${{ secrets.GH_AW_OTEL_GRAFANA_ENDPOINT }}
          SECRET_GH_AW_OTEL_SENTRY_AUTHORIZATION: ${{ secrets.GH_AW_OTEL_SENTRY_AUTHORIZATION }}
          SECRET_GH_AW_OTEL_SENTRY_ENDPOINT: ${{ secrets.GH_AW_OTEL_SENTRY_ENDPOINT }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.GH_AW_SETUP_ROOT, 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'redact_secrets.cjs'));
            const { persistDetectionMasks } = require(path.join(actionsDir, 'detection_mask_state.cjs'));
            await main({ additionalDirectories: ["${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall"], persistDetectionMasks });
      - name: Parse threat detection token usage for step summary
        id: parse_detection_token_usage
        if: always() && steps.detection_guard.outputs.run_detection == 'true' && steps.redact_detection_logs.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_TOKEN_USAGE_SUMMARY_TITLE: Threat Detection Token Usage
          GH_AW_PHASE: detection
          GH_AW_AGENT_USAGE_PATH: ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_usage.json
          GH_AW_AGENT_USAGE_JSONL_PATH: ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_usage.jsonl
          GH_AW_WRITE_EMPTY_USAGE: "true"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.GH_AW_SETUP_ROOT, 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'parse_token_usage.cjs'));
            await main();
      - name: Redact secrets in detection artifacts
        id: redact_detection_artifacts
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_SECRET_NAMES: 'GH_AW_OTEL_GRAFANA_AUTHORIZATION,GH_AW_OTEL_GRAFANA_ENDPOINT,GH_AW_OTEL_SENTRY_AUTHORIZATION,GH_AW_OTEL_SENTRY_ENDPOINT'
          SECRET_GH_AW_OTEL_GRAFANA_AUTHORIZATION: ${{ secrets.GH_AW_OTEL_GRAFANA_AUTHORIZATION }}
          SECRET_GH_AW_OTEL_GRAFANA_ENDPOINT: ${{ secrets.GH_AW_OTEL_GRAFANA_ENDPOINT }}
          SECRET_GH_AW_OTEL_SENTRY_AUTHORIZATION: ${{ secrets.GH_AW_OTEL_SENTRY_AUTHORIZATION }}
          SECRET_GH_AW_OTEL_SENTRY_ENDPOINT: ${{ secrets.GH_AW_OTEL_SENTRY_ENDPOINT }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.GH_AW_SETUP_ROOT, 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'redact_secrets.cjs'));
            const { persistDetectionMasks } = require(path.join(actionsDir, 'detection_mask_state.cjs'));
            await main({ additionalDirectories: ["${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall"], persistDetectionMasks });
      - name: Render detection log
        if: always() && steps.detection_guard.outputs.run_detection == 'true' && steps.redact_detection_logs.outcome == 'success' && steps.redact_detection_artifacts.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.GH_AW_SETUP_ROOT, 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'render_detection_log.cjs'));
            await main();
      - name: Upload threat detection artifact
        if: always() && steps.detection_guard.outputs.run_detection == 'true' && steps.redact_detection_logs.outcome == 'success' && steps.redact_detection_artifacts.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detection
          path: |
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_result.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/execution.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_usage.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_harness_retry.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall/logs/
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall/audit/
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Conclude threat detection
        id: detection_conclusion
        if: always() && steps.detection_guard.outputs.run_detection == 'false' || (always() && steps.detection_guard.outputs.run_detection == 'true' && steps.redact_detection_logs.outcome == 'success' && steps.redact_detection_artifacts.outcome == 'success')
        continue-on-error: true
        env:
          RUN_DETECTION: ${{ steps.detection_guard.outputs.run_detection }}
          DETECTION_AGENTIC_EXECUTION_OUTCOME: ${{ steps.detection_agentic_execution.outcome }}
          THREAT_DETECT_INSTALL_OUTCOME: ${{ steps.threat_detect_install.outcome }}
          AWF_INSTALL_OUTCOME: ${{ steps.detection_awf_install.outcome }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
        run: |
          bash "${GH_AW_SETUP_ROOT}/actions/conclude_threat_detection.sh" ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_result.json
      - name: Upload skipped detection execution evidence
        if: always() && steps.detection_guard.outputs.run_detection == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detection
          path: ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/execution.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}

      - name: Clean isolated runtime directories
        if: ${{ always() && env.GH_AW_SETUP_ACTION_COMPLETE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_AW_RUNTIME_ROOT:-}" || -z "${GH_AW_SETUP_ROOT:-}" || -z "${GH_AW_RUNTIME_TOKEN:-}" ]]; then exit 0; fi
          if [[ ! "$GH_AW_RUNTIME_ROOT" =~ ^/tmp/gh-aw-run\.[A-Za-z0-9]+$ ]]; then echo "::warning::Invalid runtime cleanup root"; exit 0; fi
          if [[ -z "${RUNNER_TEMP:-}" ]]; then exit 0; fi
          setup_parent="$(cd -- "$RUNNER_TEMP" && pwd -P)" || exit 0
          if [[ "${GH_AW_SETUP_ROOT%/*}" != "$setup_parent" || ! "${GH_AW_SETUP_ROOT##*/}" =~ ^gh-aw-setup\.[A-Za-z0-9]{10}$ ]]; then echo "::warning::Invalid setup cleanup root"; exit 0; fi
          owner_hash="$(printf '%s' "$GH_AW_RUNTIME_TOKEN" | sha256sum | cut -d ' ' -f1)" || exit 0
          for kind in runtime setup; do
            if [[ "$kind" == runtime ]]; then root="$GH_AW_RUNTIME_ROOT"; identity="${GH_AW_RUNTIME_ID:-}"; else root="$GH_AW_SETUP_ROOT"; identity="${GH_AW_SETUP_ID:-}"; fi
            if [[ ! -e "$root" && ! -L "$root" ]]; then continue; fi
            if [[ -L "$root" || ! -d "$root" || "$(stat -c '%d:%i' "$root")" != "$identity" || "$(stat -c '%u' "$root")" != "$(id -u)" || "$(stat -c '%a' "$root")" != 700 ]]; then echo "::warning::Refusing unowned runtime cleanup"; continue; fi
            marker="$root/.gh-aw-runtime-owner"
            if [[ -L "$marker" || ! -f "$marker" || "$(cat -- "$marker")" != "$owner_hash" ]]; then echo "::warning::Refusing runtime cleanup without ownership"; continue; fi
            rm -rf -- "$root" || echo "::warning::Could not fully remove isolated $kind directory"
          done
  evals:
    name: evals
    needs:
      - activation
      - agent
      - detection
    if: always() && needs.agent.result == 'success'
    runs-on: ubuntu-latest
    # Permissions for the evals job (workflow permissions default to none).
    permissions:
      contents: read
      copilot-requests: write # Authenticate requests to the Copilot engine.
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      aic: ${{ steps.parse_evals_token_usage.outputs.aic }}
    steps:
      - name: Allocate isolated runtime directories
        id: gh-aw-runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          GH_AW_RUNTIME_ROOT=""
          GH_AW_SETUP_ROOT=""
          trap 'status=$?; if [[ -n "$GH_AW_SETUP_ROOT" ]]; then rm -rf -- "$GH_AW_SETUP_ROOT"; fi; if [[ -n "$GH_AW_RUNTIME_ROOT" ]]; then rm -rf -- "$GH_AW_RUNTIME_ROOT"; fi; exit "$status"' EXIT
          GH_AW_RUNTIME_ROOT="$(mktemp -d /tmp/gh-aw-run.XXXXXXXXXX)"
          setup_parent="$(cd -- "${RUNNER_TEMP:?}" && pwd -P)"
          GH_AW_SETUP_ROOT="$(mktemp -d "$setup_parent/gh-aw-setup.XXXXXXXXXX")"
          GH_AW_RESOURCE_SUFFIX="${GH_AW_RUNTIME_ROOT##*/gh-aw-run.}"
          GH_AW_RUNTIME_TOKEN="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$GH_AW_RUNTIME_TOKEN"
          owner_hash="$(printf '%s' "$GH_AW_RUNTIME_TOKEN" | sha256sum | cut -d ' ' -f1)"
          printf '%s' "$owner_hash" > "$GH_AW_RUNTIME_ROOT/.gh-aw-runtime-owner"
          printf '%s' "$owner_hash" > "$GH_AW_SETUP_ROOT/.gh-aw-runtime-owner"
          case "$GH_AW_SETUP_ROOT" in *$'\n'*|*$'\r'*) echo "Invalid setup root" >&2; exit 1 ;; esac
          printf 'GH_AW_RUNTIME_ROOT=%s\nGH_AW_SETUP_ROOT=%s\nGH_AW_RESOURCE_SUFFIX=%s\nGH_AW_RUNTIME_TOKEN=%s\n' "$GH_AW_RUNTIME_ROOT" "$GH_AW_SETUP_ROOT" "$GH_AW_RESOURCE_SUFFIX" "$GH_AW_RUNTIME_TOKEN" >> "$GITHUB_ENV"
