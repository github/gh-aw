          GH_AW_DECISIONS_API_KEY: ${{ github.token }}
          GH_AW_DECISIONS_PROVIDER: github-copilot
          GH_AW_EVALS_QUESTIONS: '[{"id":"dependabot_batch_analyzed","question":"Did the agent analyze the selected grouped Dependabot remediation batch? Return UNKNOWN when the output records a skip-if-decision no-op before agent execution."},{"id":"remediation_reported","question":"Did the agent create a remediation pull request or clearly report why no remediation was needed or possible, including a reason for each selected PR left unaddressed?"},{"id":"repository_dependency_scope","question":"When open Dependabot PRs were provided, did the agent consider every selected PR regardless of manifest path or dependency ecosystem, without excluding source manifests, lockfiles, named Python requirements, Go modules, or Dockerfiles solely for being outside compiler-generated workflow manifests? Return UNKNOWN when no open Dependabot PRs were provided."}]'
