        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage
          path: |
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/aw_session.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/aw_info.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/aw-info.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent_usage.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/detection_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/evals.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/graders/grader_manifest.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/graders/grader_results.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/github_rate_limits.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent/token_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent/model-routing.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent/execution.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent/harness_retry.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent/durable-session.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/detection/token_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/detection/execution.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/detection/harness_retry.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/detection/detection_result.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/evals/token_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/evals/execution.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/evals/evals_status.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/experiment/state.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/experiment/state.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/experiment/assignments.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/activity/summary.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Wait before retrying usage artifact upload
        if: always() && steps.upload-usage-artifact.outcome == 'failure'
        run: sleep 10
      - name: Retry upload usage artifact
        id: upload-usage-artifact-retry
        if: always() && steps.upload-usage-artifact.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage
          path: |
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/aw_session.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/aw_info.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/aw-info.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent_usage.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/detection_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/evals.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/graders/grader_manifest.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/graders/grader_results.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/github_rate_limits.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent/token_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent/model-routing.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent/execution.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent/harness_retry.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/agent/durable-session.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/detection/token_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/detection/execution.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/detection/harness_retry.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/detection/detection_result.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/evals/token_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/evals/execution.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/evals/evals_status.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/experiment/state.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/experiment/state.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/experiment/assignments.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/usage/activity/summary.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Report admission conclusion
        if: always() && vars.GH_AW_DEFAULT_ADMISSION_URL != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_DEFAULT_ADMISSION_URL: ${{ vars.GH_AW_DEFAULT_ADMISSION_URL }}
          GH_AW_DEFAULT_ADMISSION_AUDIENCE: ${{ vars.GH_AW_DEFAULT_ADMISSION_AUDIENCE }}
          GH_AW_DEFAULT_ADMISSION_ON_OUTAGE: ${{ vars.GH_AW_DEFAULT_ADMISSION_ON_OUTAGE }}
          GH_AW_ADMISSION_WORKFLOW_HASH: "361037af88a156f39cdbce90c9bea3855f47d604a9bba655e28f3b17286ce7f0:4ff99d72875c4a251ef41e89f37f708a058dd2f118d0f3aa53622509f91d123b"
          GH_AW_INFO_WORKFLOW_ID: ${{ job.workflow_ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_AW_USAGE_ARTIFACT_ID: ${{ steps.upload-usage-artifact.outputs.artifact-id }}
          GH_AW_USAGE_ARTIFACT_RETRY_ID: ${{ steps.upload-usage-artifact-retry.outputs.artifact-id }}
        with:
          script: |
            const { setupGlobals } = require(require('node:path').join(process.env.GH_AW_SETUP_ROOT, 'actions', 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            await require(require('node:path').join(process.env.GH_AW_SETUP_ROOT, 'actions', 'conclusion_admission.cjs')).main(core);

      - name: Clean isolated runtime directories
        if: ${{ always() && env.GH_AW_SETUP_ACTION_COMPLETE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_AW_RUNTIME_ROOT:-}" || -z "${GH_AW_SETUP_ROOT:-}" || -z "${GH_AW_RUNTIME_TOKEN:-}" ]]; then exit 0; fi
          if [[ ! "$GH_AW_RUNTIME_ROOT" =~ ^/tmp/gh-aw-run\.[A-Za-z0-9]+$ ]]; then echo "::warning::Invalid runtime cleanup root"; exit 0; fi
          if [[ -z "${RUNNER_TEMP:-}" ]]; then exit 0; fi
          setup_parent="$(cd -- "$RUNNER_TEMP" && pwd -P)" || exit 0
          if [[ "${GH_AW_SETUP_ROOT%/*}" != "$setup_parent" || ! "${GH_AW_SETUP_ROOT##*/}" =~ ^gh-aw-setup\.[A-Za-z0-9]{10}$ ]]; then echo "::warning::Invalid setup cleanup root"; exit 0; fi
          owner_hash="$(printf '%s' "$GH_AW_RUNTIME_TOKEN" | sha256sum | cut -d ' ' -f1)" || exit 0
          for kind in runtime setup; do
            if [[ "$kind" == runtime ]]; then root="$GH_AW_RUNTIME_ROOT"; identity="${GH_AW_RUNTIME_ID:-}"; else root="$GH_AW_SETUP_ROOT"; identity="${GH_AW_SETUP_ID:-}"; fi
            if [[ ! -e "$root" && ! -L "$root" ]]; then continue; fi
            if [[ -L "$root" || ! -d "$root" || "$(stat -c '%d:%i' "$root")" != "$identity" || "$(stat -c '%u' "$root")" != "$(id -u)" || "$(stat -c '%a' "$root")" != 700 ]]; then echo "::warning::Refusing unowned runtime cleanup"; continue; fi
            marker="$root/.gh-aw-runtime-owner"
            if [[ -L "$marker" || ! -f "$marker" || "$(cat -- "$marker")" != "$owner_hash" ]]; then echo "::warning::Refusing runtime cleanup without ownership"; continue; fi
            rm -rf -- "$root" || echo "::warning::Could not fully remove isolated $kind directory"
          done
  detection:
    name: detection
    needs:
      - activation
      - agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    # Permissions for the detection job (workflow permissions default to none).
    permissions:
      contents: read
      copilot-requests: write # Authenticate requests to the Copilot engine.
    timeout-minutes: 10
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      aic: ${{ steps.parse_detection_token_usage.outputs.aic }}
      detection_conclusion: ${{ steps.detection_conclusion.outputs.conclusion }}
      detection_reason: ${{ steps.detection_conclusion.outputs.reason }}
      detection_success: ${{ steps.detection_conclusion.outputs.success }}
      detection_threat_kinds: ${{ steps.detection_conclusion.outputs.threat_kinds }}
      run_detection: ${{ steps.detection_guard.outputs.run_detection }}
    steps:
      - name: Allocate isolated runtime directories
        id: gh-aw-runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          GH_AW_RUNTIME_ROOT=""
          GH_AW_SETUP_ROOT=""
          trap 'status=$?; if [[ -n "$GH_AW_SETUP_ROOT" ]]; then rm -rf -- "$GH_AW_SETUP_ROOT"; fi; if [[ -n "$GH_AW_RUNTIME_ROOT" ]]; then rm -rf -- "$GH_AW_RUNTIME_ROOT"; fi; exit "$status"' EXIT
          GH_AW_RUNTIME_ROOT="$(mktemp -d /tmp/gh-aw-run.XXXXXXXXXX)"
          setup_parent="$(cd -- "${RUNNER_TEMP:?}" && pwd -P)"
          GH_AW_SETUP_ROOT="$(mktemp -d "$setup_parent/gh-aw-setup.XXXXXXXXXX")"
          GH_AW_RESOURCE_SUFFIX="${GH_AW_RUNTIME_ROOT##*/gh-aw-run.}"
          GH_AW_RUNTIME_TOKEN="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$GH_AW_RUNTIME_TOKEN"
          owner_hash="$(printf '%s' "$GH_AW_RUNTIME_TOKEN" | sha256sum | cut -d ' ' -f1)"
          printf '%s' "$owner_hash" > "$GH_AW_RUNTIME_ROOT/.gh-aw-runtime-owner"
          printf '%s' "$owner_hash" > "$GH_AW_SETUP_ROOT/.gh-aw-runtime-owner"
          case "$GH_AW_SETUP_ROOT" in *$'\n'*|*$'\r'*) echo "Invalid setup root" >&2; exit 1 ;; esac
          printf 'GH_AW_RUNTIME_ROOT=%s\nGH_AW_SETUP_ROOT=%s\nGH_AW_RESOURCE_SUFFIX=%s\nGH_AW_RUNTIME_TOKEN=%s\n' "$GH_AW_RUNTIME_ROOT" "$GH_AW_SETUP_ROOT" "$GH_AW_RESOURCE_SUFFIX" "$GH_AW_RUNTIME_TOKEN" >> "$GITHUB_ENV"
          printf 'GH_AW_RUNTIME_ID=%s\nGH_AW_SETUP_ID=%s\n' "$(stat -c '%d:%i' "$GH_AW_RUNTIME_ROOT")" "$(stat -c '%d:%i' "$GH_AW_SETUP_ROOT")" >> "$GITHUB_ENV"
          trap - EXIT
      - name: Checkout actions folder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          sparse-checkout: |
            actions
          fetch-depth: 1
          clean: false
          persist-credentials: false
      - name: Setup Scripts
        id: setup
        uses: ./actions/setup
        with:
          destination: ${{ env.GH_AW_SETUP_ROOT }}/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Dependabot Burner"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/dependabot-burner.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.5.2"
          GH_AW_INFO_AWF_VERSION: "v0.29.16"
          GH_AW_INFO_ENGINE_ID: "pi"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Download activation artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activation
          path: ${{ env.GH_AW_RUNTIME_ROOT }}
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: ${{ env.GH_AW_RUNTIME_ROOT }}/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p ${{ env.GH_AW_RUNTIME_ROOT }}/
          find "${{ env.GH_AW_RUNTIME_ROOT }}/" -type f -print
          if [ -f "${{ env.GH_AW_RUNTIME_ROOT }}/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=${{ env.GH_AW_RUNTIME_ROOT }}/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Clear agent token usage
        if: always()
        run: rm -f ${{ env.GH_AW_RUNTIME_ROOT }}/agent_usage.json
      - name: Checkout repository for patch context
        if: needs.agent.outputs.has_patch == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --- Threat Detection ---
      - name: Initialize detection execution evidence
        run: |
          mkdir -p "${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection"
          evidence_tmp="${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/execution.json.tmp"
          printf '{"version":1,"component":"detection","run_id":%s,"run_attempt":%s,"state":"not_started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/execution.json"
      - name: Clear inherited Copilot session state
        run: rm -rf ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/agent/logs/copilot-session-state
      - name: Clean stale firewall files from agent artifact
        run: |
          rm -rf ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/firewall/logs
          rm -rf ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/firewall/audit
      - name: Download container images
        run: bash "${GH_AW_SETUP_ROOT}/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.29.16@sha256:6c623033b0537a92474b94fb49d1960d6bf8f41ae27e1a33b63d56f779855964 ghcr.io/github/gh-aw-firewall/api-proxy:0.29.16@sha256:88a95a3cab5f4b44cf01b2dd4539dbd6a9ccb907519250ccdabe598101e5a1d8 ghcr.io/github/gh-aw-firewall/squid:0.29.16@sha256:fcac76862a1d901f8adb0eb491b99d8d1f6d08f08e8c17d77b883ec671e918c1
      - name: Check if detection needed
        id: detection_guard
        if: always()
        env:
          OUTPUT_TYPES: ${{ needs.agent.outputs.output_types }}
          HAS_PATCH: ${{ needs.agent.outputs.has_patch }}
        run: |
          if [[ -n "$OUTPUT_TYPES" || "$HAS_PATCH" == "true" ]]; then
            echo "run_detection=true" >> "$GITHUB_OUTPUT"
            echo "Detection will run: output_types=$OUTPUT_TYPES, has_patch=$HAS_PATCH"
          else
            echo "run_detection=false" >> "$GITHUB_OUTPUT"
            echo "Detection skipped: no agent outputs or patches to analyze"
          fi
      - name: Clear MCP Config for detection
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        run: |
          rm -f "${GH_AW_SETUP_ROOT}/mcp-config/mcp-servers.json"
          rm -f "$HOME/.copilot/mcp-config.json"
          rm -f "$GITHUB_WORKSPACE/.gemini/settings.json"
      - name: Prepare threat detection files
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        run: |
          bash "${GH_AW_SETUP_ROOT}/actions/prepare_threat_detection_files.sh"
      - name: Setup threat detection
        id: detection_setup
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW_NAME: "Dependabot Burner"
          WORKFLOW_DESCRIPTION: "Runs one grouped Dependabot remediation wave from schedule, manual dispatch, or /dependabot-burner on pull requests"
          HAS_PATCH: ${{ needs.agent.outputs.has_patch }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
          GH_AW_DETECTION_SKIP_PROMPT_SUMMARY: "true"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.GH_AW_SETUP_ROOT, 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'setup_threat_detection.cjs'));
            await main();
      - name: Ensure threat-detection directory and log
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        run: |
          mkdir -p ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection
          touch ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection.log
      - name: Install AWF binary
        id: detection_awf_install
        run: bash "${GH_AW_SETUP_ROOT}/actions/install_awf_binary.sh" v0.29.16 --rootless
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install GitHub Copilot CLI
        run: bash "${GH_AW_SETUP_ROOT}/actions/install_copilot_cli.sh" 1.0.103 --checksums-sha256 26cd3e4b32cde498e4961fb4d48e7b85d7859fc69af1a645a19201fdd577bdb2 --prefer-toolcache --cooldown-days 3
        env:
          GH_HOST: github.com
          GITHUB_TOKEN: ${{ github.token }}
          GH_AW_COPILOT_MIN_VERSION: 1.0.35
      - name: Install threat-detect binary
        id: threat_detect_install
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        run: |
          bash "${GH_AW_SETUP_ROOT}/actions/install_threat_detect_binary.sh" v0.5.3 --artifact-base-url https://github.com/github/gh-aw-threat-detection/releases/download --sha256-amd64 7cfab3bd02717968a0584ddd3790cff22550059e36d6f656c4f35e9d27851009 --sha256-arm64 6f355949af98e7b5527a958ac11431bd7867db45c0191b94c3a205c662181cc6
      - name: Execute threat detection with AWF
        id: detection_agentic_execution
        if: always() && steps.detection_guard.outputs.run_detection == 'true' && steps.detection_setup.outcome == 'success' && steps.detection_setup.outputs.ready == 'true' && steps.threat_detect_install.outcome == 'success' && steps.detection_awf_install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          AWF_REFLECT_ENABLED: 1
          COPILOT_AGENT_RUNNER_TYPE: STANDALONE
          COPILOT_DUMMY_BYOK: dummy-byok-key-for-offline-mode
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: gpt-5
          GH_AW_ADMISSION_MAX_AI_CREDITS: ${{ needs.activation.outputs.admission-max-ai-credits-threat-detection }}
          GH_AW_ADMISSION_RESULT: ${{ needs.activation.outputs.admission-result }}
          GH_AW_HARNESS_MAX_RETRIES: 0
          GH_AW_LLM_PROVIDER: github
          GH_AW_MAX_AI_CREDITS: ${{ vars.GH_AW_DEFAULT_DETECTION_MAX_AI_CREDITS || '400' }}
          GH_AW_MAX_TURNS: ${{ vars.GH_AW_DEFAULT_MAX_TURNS || '' }}
          GH_AW_PHASE: detection
          GH_AW_PROMPT: ${{ env.GH_AW_RUNTIME_ROOT }}/aw-prompts/prompt.txt
          GH_AW_TIMEOUT_MINUTES: 10
          GH_AW_VERSION: dev
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_AW: true
          GITHUB_COPILOT_INTEGRATION_ID: agentic-workflows
          GITHUB_COPILOT_PROMPT_MODE_EXTENSIONS: false
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_STEP_SUMMARY: ${{ env.GH_AW_RUNTIME_ROOT }}/agent-step-summary.md
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          RUNNER_TEMP: ${{ runner.temp }}
          S2STOKENS: true
          TRACEPARENT: ${{ env.GITHUB_AW_OTEL_TRACE_ID != '' && env.GITHUB_AW_OTEL_PARENT_SPAN_ID != '' && format('00-{0}-{1}-01', env.GITHUB_AW_OTEL_TRACE_ID, env.GITHUB_AW_OTEL_PARENT_SPAN_ID) || '' }}
          WORKFLOW_NAME: "Dependabot Burner"
          WORKFLOW_DESCRIPTION: "Runs one grouped Dependabot remediation wave from schedule, manual dispatch, or /dependabot-burner on pull requests"
          HAS_PATCH: ${{ needs.agent.outputs.has_patch }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
          GH_AW_DETECTION_INPUT_DIR: "${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection-inputs"
        run: |
          unset GH_AW_RUNTIME_TOKEN GH_AW_RUNTIME_ID GH_AW_SETUP_ID
          mkdir -p "${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection"
          evidence_tmp="${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/execution.json.tmp"
          printf '{"version":1,"component":"detection","run_id":%s,"run_attempt":%s,"state":"started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/execution.json"
          export GH_AW_AWF_EXECUTION_COMPONENT="detection"
          export GH_AW_AWF_EXECUTION_EVIDENCE_FILE="${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/execution.json"
          set -o pipefail
          printf '%s' "$(date +%s%3N)" > ${{ env.GH_AW_RUNTIME_ROOT }}/agent_cli_start_ms.txt
          GH_AW_COPILOT_SRC="$(command -v copilot 2>/dev/null || true)"
          if [ -z "$GH_AW_COPILOT_SRC" ] || [ ! -x "$GH_AW_COPILOT_SRC" ]; then
            echo "GitHub Copilot CLI executable not found on PATH after installation" >&2
            exit 127
          fi
          GH_AW_COPILOT_BIN="${GH_AW_SETUP_ROOT}/bin/copilot"
          mkdir -p "${GH_AW_SETUP_ROOT}/bin"
          if [ "$GH_AW_COPILOT_SRC" != "$GH_AW_COPILOT_BIN" ]; then
