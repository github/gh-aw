            _GH_AW_CHROOT_JSON=$(jq -c --arg src "${GH_AW_SETUP_ROOT}" --arg user "$(id -un)" --argjson uid "$(id -u)" --argjson gid "$(id -g)" --arg home "${GH_AW_SETUP_ROOT}/home" '.chroot={"binariesSourcePath":$src,"identity":{"user":$user,"uid":$uid,"gid":$gid,"home":$home}}' "${GH_AW_SETUP_ROOT}/awf-config.json") || { echo "chroot config patch failed" >&2; exit 1; }
            printf '%s\n' "$_GH_AW_CHROOT_JSON" > "${GH_AW_SETUP_ROOT}/awf-config.json"
          fi
          GH_AW_TOOL_CACHE_MOUNT=""
