          GH_AW_PYTHON_VERSION_CHECK: |
            import os
            import re
            import sys
            from importlib.metadata import distributions

            normalize = lambda name: re.sub(r"[-_.]+", "-", name).lower()
            name = os.environ["GH_AW_PYTHON_PACKAGE"]
            expected = os.environ["GH_AW_PYTHON_PACKAGE_VERSION"]
            found = [d.version for d in distributions(path=[os.environ["GH_AW_PYTHON_PACKAGES"]]) if normalize(d.metadata["Name"]) == normalize(name)]
            if found != [expected]:
                sys.exit(f"Installed {name} versions {found} do not match the required version {expected}; update the hash-locked requirements with engine.version")
            print(f"Verified {name}=={expected}")
        run: |
          set -euo pipefail
          rm -rf /tmp/gh-aw/agent/aider-python
          mkdir -p /tmp/gh-aw/agent/aider-python/site-packages
          printf '%s' "$GH_AW_PYTHON_REQUIREMENTS" > /tmp/gh-aw/agent/aider-python/requirements.txt
          python3 -I -m pip install --quiet --isolated --disable-pip-version-check --no-input --no-cache-dir \
            --only-binary=:all: --require-hashes \
            --target "$GH_AW_PYTHON_PACKAGES" --requirement /tmp/gh-aw/agent/aider-python/requirements.txt
          python3 -I -c "$GH_AW_PYTHON_VERSION_CHECK"
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const determineAutomaticLockdown = require(path.join(actionsDir, 'determine_automatic_lockdown.cjs'));
            await determineAutomaticLockdown(github, context, core);
      - name: Restore agent config folders from base branch
        if: steps.checkout-pr.outputs.checked_out == 'true'
        env:
          GH_AW_AGENT_FOLDERS: ".agents .aider .github"
          GH_AW_AGENT_FILES: ".aider.conf.yml AGENTS.md CONVENTIONS.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_base_github_folders.sh"
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".aider/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".aider/skills"
