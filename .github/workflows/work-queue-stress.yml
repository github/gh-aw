name: Work Queue Stress

on:
  pull_request:
    paths:
      - '.github/workflows/work-queue-stress.yml'
      - '.github/scripts/work-queue-stress*.cjs'
      - 'actions/setup/js/**/*work_queue*.cjs'
      - 'actions/setup/js/**/*work_queue*.js'
      - 'specs/work-queue/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/work-queue-stress.yml'
      - '.github/scripts/work-queue-stress*.cjs'
      - 'actions/setup/js/**/*work_queue*.cjs'
      - 'actions/setup/js/**/*work_queue*.js'
      - 'specs/work-queue/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: work-queue-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Local Git and concurrent workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HISTORY_ITEMS: ${{ github.event_name == 'pull_request' && '256' || '100000' }}
      LIFECYCLE_ITEMS: ${{ github.event_name == 'pull_request' && '16' || '1024' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify simulator invariants
        id: invariants
        run: |
          mkdir -p stress-results
          node --test .github/scripts/work-queue-stress.test.cjs .github/scripts/work-queue-stress-summary.test.cjs \
            | tee stress-results/invariants.tap

      - name: Replay retained Work and Claim items
        id: history
        run: |
          node .github/scripts/work-queue-stress.cjs \
            --mode history --items "$HISTORY_ITEMS" --workers 2 --seed 7 \
            --timeout-seconds 300 > stress-results/history.json

      - name: Complete concurrent worker lifecycles
        id: lifecycle
        run: |
          node .github/scripts/work-queue-stress.cjs \
            --items "$LIFECYCLE_ITEMS" --workers 4 --queue-items 64 --seed 7 \
            --timeout-seconds 600 > stress-results/lifecycle.json

      - name: Verify single-queue admission saturation
        id: saturation
        run: |
          node .github/scripts/work-queue-stress.cjs \
            --mode saturation --items 100000 --workers 4 --seed 7 \
            --timeout-seconds 60 > stress-results/saturation.json

      - name: Publish stress performance summary
        if: always()
        env:
          INVARIANTS_OUTCOME: ${{ steps.invariants.outcome }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          SATURATION_OUTCOME: ${{ steps.saturation.outcome }}
        run: node .github/scripts/work-queue-stress-summary.cjs stress-results

      - name: Upload stress diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-queue-stress-results
          path: stress-results/
          if-no-files-found: error
          retention-days: 7
