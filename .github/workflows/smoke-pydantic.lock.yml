          fs.writeFileSync(configPath, JSON.stringify({ mcpServers }, null, 2), { mode: 0o600 });
          fs.chmodSync(configPath, 0o600);
          console.log(`Wrote ${Object.keys(mcpServers).length} MCP server(s) to ${configPath}`);

