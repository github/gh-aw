          GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
          GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
          GH_AW_DETECTION_THREAT_KINDS: ${{ needs.detection.outputs.detection_threat_kinds }}
          GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
          GH_AW_SAFE_OUTPUT_MESSAGES: "{\"footer\":\"\\u003e 🧑\u200d✈️ *[{workflow_name}]({run_url}) — Powered by Aider*{ai_credits_suffix}{history_link}\",\"runStarted\":\"🧑\u200d✈️ Aider initializing... [{workflow_name}]({run_url}) begins on this {event_type}...\",\"runSuccess\":\"🧑\u200d✈️ [{workflow_name}]({run_url}) Aider delivered.\",\"runFailure\":\"⚠️ [{workflow_name}]({run_url}) {status}. Aider encountered unexpected challenges...\"}"
        with:
