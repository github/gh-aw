        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: safe-outputs-items
          merge-multiple: true
          path: ${{ env.GH_AW_RUNTIME_ROOT }}/
      - name: Process no-op messages
        id: noop
