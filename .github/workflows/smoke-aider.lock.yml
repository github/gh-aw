        if: always() && steps.detection_guard.outputs.run_detection == 'true' && steps.redact_detection_logs.outcome == 'success' && steps.redact_detection_artifacts.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detection
          path: |
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection.log
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/execution.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_usage.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/detection_harness_retry.json
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall/logs/
            ${{ env.GH_AW_RUNTIME_ROOT }}/threat-detection/sandbox/firewall/audit/
