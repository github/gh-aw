  comment_release_prs:
    needs:
      - agent
      - config
      - release
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Comment on pull requests included in release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.config.outputs.release_tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseTag = process.env.RELEASE_TAG;
            const releaseId = Number(process.env.RELEASE_ID);

            if (!releaseTag || Number.isNaN(releaseId)) {
              core.setFailed(`Missing or invalid release context: RELEASE_TAG=${releaseTag}, RELEASE_ID=${process.env.RELEASE_ID}`);
              return;
            }

            const { data: currentRelease } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId
            });

            core.info(`Current release: tag=${currentRelease.tag_name}, id=${currentRelease.id}, sha=${currentRelease.target_commitish}, published_at=${currentRelease.published_at}, url=${currentRelease.html_url}`);

            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });

            const currentPublishedAt = new Date(currentRelease.published_at);
            const previousRelease = releases.find((release) =>
              release.id !== currentRelease.id &&
              !release.draft &&
              release.published_at &&
              new Date(release.published_at) < currentPublishedAt
            );

            if (!previousRelease) {
              core.info(`No previous release found before ${releaseTag}; skipping PR comments.`);
              return;
            }

            core.info(`Previous release: tag=${previousRelease.tag_name}, id=${previousRelease.id}, sha=${previousRelease.target_commitish}, published_at=${previousRelease.published_at}, url=${previousRelease.html_url}`);

            const query = [
              `repo:${owner}/${repo}`,
              "is:pr",
              "is:merged",
              `merged:${previousRelease.published_at}..${currentRelease.published_at}`
            ].join(" ");

            core.info(`Searching merged PRs with query: ${query}`);

            const mergedPrs = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: query,
              per_page: 100
            });

            if (mergedPrs.length === 0) {
              core.info(`No merged PRs found between ${previousRelease.tag_name} and ${releaseTag}.`);
              return;
            }

            core.info(`Found ${mergedPrs.length} merged PR(s) between ${previousRelease.tag_name} and ${releaseTag}.`);

            const marker = `<!-- gh-aw-release:${releaseTag} -->`;
            const releaseUrl = currentRelease.html_url;
            const commentBody = [
              "🎉 This pull request is included in a new release.",
              "",
              `Release: [\`${releaseTag}\`](${releaseUrl})`,
              "",
              marker
            ].join("\n");

            core.info(`Comment body to post:\n${commentBody}`);

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const commentDelayMs = 1000;
            const withRetry = async (fn, label) => {
              const maxAttempts = 3;
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  return await fn();
                } catch (error) {
                  if (attempt === maxAttempts) throw error;
                  core.warning(`${label} failed on attempt ${attempt}/${maxAttempts}: ${error.message}`);
                  await sleep(attempt * 1000);
                }
              }
            };

            let commentedCount = 0;
            let skippedCount = 0;

            for (const pr of mergedPrs) {
              const comments = await withRetry(
                () =>
                  github.paginate(github.rest.issues.listComments, {
                    owner,
                    repo,
                    issue_number: pr.number,
                    per_page: 100
                  }),
                `Listing comments for #${pr.number}`
              );

              const alreadyCommented = comments.some((comment) => comment.body?.includes(marker));
              if (alreadyCommented) {
                skippedCount += 1;
                continue;
              }

              if (commentedCount > 0) {
                await sleep(commentDelayMs);
              }

              await withRetry(
                () =>
                  github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pr.number,
                    body: commentBody
                  }),
                `Creating release comment for #${pr.number}`
              );
              core.info(`Commented on PR #${pr.number}: ${pr.title} — ${pr.html_url}`);
              commentedCount += 1;
            }

            core.info(`Release PR commenting complete: commented=${commentedCount}, skipped=${skippedCount}, total=${mergedPrs.length}`);

  conclusion:
    needs:
      - activation
      - agent
      - comment_release_prs
      - config
      - defender
      - evals
      - push_evals_state
      - push_tag
      - release
      - safe_outputs
      - sync_actions
      - validate_container_pins
    if: >
      always() && (needs.agent.result != 'skipped' || needs.activation.outputs.lockdown_check_failed == 'true' ||
      needs.activation.outputs.oauth_token_check_failed == 'true' || needs.activation.outputs.stale_lock_file_failed == 'true' ||
      needs.activation.outputs.secret_verification_result == 'failed' || needs.activation.outputs.daily_ai_credits_exceeded == 'true')
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: write
      issues: write
    concurrency:
      group: "gh-aw-conclusion-release"
      cancel-in-progress: false
      queue: max
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      incomplete_count: ${{ steps.report_incomplete.outputs.incomplete_count }}
      noop_message: ${{ steps.noop.outputs.noop_message }}
      tools_reported: ${{ steps.missing_tool.outputs.tools_reported }}
      total_count: ${{ steps.missing_tool.outputs.total_count }}
    steps:
      - name: Checkout actions folder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          sparse-checkout: |
            actions
          clean: false
          persist-credentials: false
      - name: Setup Scripts
        id: setup
        uses: ./actions/setup
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Release"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/release.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.83"
          GH_AW_INFO_AWF_VERSION: "v0.28.15"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Download Safe Outputs Items Manifest
        id: download-safe-outputs-manifest
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: safe-outputs-items
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Download evals artifact
        id: download-evals-artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evals
          merge-multiple: true
          path: /tmp/gh-aw/evals/
      - name: Collect usage artifact files
        if: always()
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/gh-aw/actions/collect_usage_artifact_files.sh"
      - name: Upload usage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usage
          path: |
            /tmp/gh-aw/usage/aw_info.json
            /tmp/gh-aw/usage/aw-info.jsonl
            /tmp/gh-aw/usage/agent_usage.json
            /tmp/gh-aw/usage/agent_usage.jsonl
            /tmp/gh-aw/usage/detection_usage.jsonl
            /tmp/gh-aw/usage/evals.jsonl
            /tmp/gh-aw/usage/graders/grader_manifest.json
            /tmp/gh-aw/usage/graders/grader_results.json
            /tmp/gh-aw/usage/github_rate_limits.jsonl
            /tmp/gh-aw/usage/agent/token_usage.jsonl
            /tmp/gh-aw/usage/detection/token_usage.jsonl
            /tmp/gh-aw/usage/evals/token_usage.jsonl
            /tmp/gh-aw/usage/activity/summary.json
          if-no-files-found: ignore
      - name: Process no-op messages
        id: noop
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_NOOP_MAX: "1"
          GH_AW_WORKFLOW_NAME: "Release"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/release.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_AGENT_CONCLUSION: ${{ needs.agent.result }}
          GH_AW_NOOP_REPORT_AS_ISSUE: "false"
          GH_AW_AIC: ${{ needs.agent.outputs.aic }}
          GH_AW_EVALS_AIC: ${{ needs.evals.outputs.aic }}
          GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
          GH_AW_WORKFLOW_ID: "release"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'handle_noop_message.cjs'));
            await main();
      - name: Record missing tool
        id: missing_tool
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_MISSING_TOOL_CREATE_ISSUE: "true"
          GH_AW_WORKFLOW_NAME: "Release"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/release.md"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
