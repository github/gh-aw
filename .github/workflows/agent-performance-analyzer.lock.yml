      - name: Parse BinEval results
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_EVALS_QUESTIONS: '[{"id":"performance_analyzed","question":"Did the agent analyze AI agent performance and quality metrics across the repository?"},{"id":"report_produced","question":"Was a report or discussion produced summarizing agent effectiveness findings?"}]'
