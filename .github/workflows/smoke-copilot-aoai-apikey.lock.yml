                "create_issue": " CONSTRAINTS: Maximum 1 issue(s) can be created. Labels [\"automation\" \"testing\"] will be automatically added.",
                "create_pull_request_review_comment": " CONSTRAINTS: Maximum 5 review comment(s) can be created. Comments will be on the RIGHT side of the diff.",
                "remove_labels": " CONSTRAINTS: Only these labels can be removed: [smoke].",
                "reply_to_pull_request_review_comment": " CONSTRAINTS: Maximum 5 reply/replies can be created.",
                "submit_pull_request_review": " CONSTRAINTS: Maximum 1 review(s) can be submitted."
              },
              "repo_params": {
                "add_comment": {
                  "description": "Target repository for this operation in 'owner/repo' format. Must be the target-repo or in the allowed-repos list.",
                  "type": "string"
                },
                "add_labels": {
                  "description": "Target repository for this operation in 'owner/repo' format. Must be the target-repo or in the allowed-repos list.",
                  "type": "string"
                }
              },
              "dynamic_tools": [
                {
                  "description": "Send a message to Slack (stub for testing)",
                  "inputSchema": {
                    "additionalProperties": false,
                    "properties": {
                      "message": {
                        "default": "",
                        "description": "The message to send",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "name": "send_slack_message"
                },
                {
                  "_workflow_name": "haiku-printer",
                  "description": "Dispatch the 'haiku-printer' workflow with workflow_dispatch trigger. This workflow must support workflow_dispatch and be in .github/workflows/ directory in the same repository. Use the 'ref' parameter to target a specific branch or tag (allowed patterns: refs/heads/${GH_AW_GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH}).",
                  "inputSchema": {
                    "additionalProperties": false,
                    "properties": {
                      "message": {
                        "description": "Message to print",
