              "description_suffixes": {
                "add_comment": " CONSTRAINTS: Maximum 2 comment(s) can be added. Supports reply_to_id for discussion threading.",
                "add_labels": " CONSTRAINTS: Only these labels are allowed: [\"smoke-copilot-aoai-apikey\"].",
                "create_check_run": " CONSTRAINTS: Maximum 1 check run(s) can be created. Check run name: \"Smoke Copilot - AOAI (apikey)\".",
