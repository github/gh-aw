            const logEntries = [];
            const mcpFailures = [];
            let maxTurnsHit = false;
            const AWF_INFRA_RE = /^\[(INFO|WARN|SUCCESS|ERROR|entrypoint|health-check)\]|^ (?:Container|Network|Volume) |^Process exiting with code:/;
