          GH_AW_EVALS_QUESTIONS: '[{"id":"output_format_goal_met","question":"Does the report''s writing style match the assigned output_format variant (e.g., short active-voice sentences with one fact per sentence when the variant is \"ste\")?"},{"id":"tasks-extracted","question":"Does the agent output show that actionable tasks were identified from the analyzed discussions?"},{"id":"labels-applied","question":"Does the agent output confirm that the created issues include the expected labels (code-quality, automation, task-mining)?"}]'
          GH_AW_EVALS_MODEL: "evals"
          GH_AW_EVALS_PHASE: setup
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'run_evals.cjs'));
            await main();
      - name: Ensure evals directory and log
        run: |
