          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: activation
          path: /tmp/gh-aw
      # Cache memory file share configuration from frontmatter processed below
      - name: Create cache-memory directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_cache_memory_dir.sh"
      - name: Restore cache-memory file share data
        id: restore_cache_memory_0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: memory-none-nopolicy-discussions-data-${{ github.run_id }}
          path: /tmp/gh-aw/cache-memory
          restore-keys: |
            memory-none-nopolicy-discussions-data-
      - name: Setup cache-memory git repository
        env:
          GH_AW_CACHE_DIR: /tmp/gh-aw/cache-memory
          GH_AW_MIN_INTEGRITY: none
        run: bash "${RUNNER_TEMP}/gh-aw/actions/setup_cache_memory_git.sh"
      # Repo memory git-based storage configuration from frontmatter processed below
      - name: Clone repo-memory branch (default)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          BRANCH_NAME: memory/deep-report
          TARGET_REPO: ${{ github.repository }}
          MEMORY_DIR: /tmp/gh-aw/repo-memory/default
          CREATE_ORPHAN: true
        run: bash "${RUNNER_TEMP}/gh-aw/actions/clone_repo_memory_branch.sh"
      - name: Install gh CLI
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/install_gh_cli.sh"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        name: Fetch discussions
        run: |
          # Create output directories
          mkdir -p /tmp/gh-aw/agent/discussions-data
          mkdir -p /tmp/gh-aw/cache-memory

          # Use UTC six-hour buckets so scheduled reports receive fresh data each run.
          TODAY=$(date -u '+%Y-%m-%d')
          HOUR=$(date -u '+%H')
          HOUR_BUCKET=$(printf '%02d' "$((10#$HOUR / 6 * 6))")
          CACHE_BUCKET="${TODAY}-${HOUR_BUCKET}"
          CACHE_DIR="/tmp/gh-aw/cache-memory"

          # Check if cached data exists from this six-hour bucket
          if [ -f "$CACHE_DIR/discussions-${CACHE_BUCKET}.json" ] && [ -s "$CACHE_DIR/discussions-${CACHE_BUCKET}.json" ]; then
            echo "✓ Found cached discussions data from ${CACHE_BUCKET}"
            cp "$CACHE_DIR/discussions-${CACHE_BUCKET}.json" /tmp/gh-aw/agent/discussions-data/discussions.json

            # Regenerate schema if missing
            if [ ! -f "$CACHE_DIR/discussions-${CACHE_BUCKET}-schema.json" ]; then
              ./.github/skills/jqschema/jqschema.sh < /tmp/gh-aw/agent/discussions-data/discussions.json > "$CACHE_DIR/discussions-${CACHE_BUCKET}-schema.json"
            fi
            cp "$CACHE_DIR/discussions-${CACHE_BUCKET}-schema.json" /tmp/gh-aw/agent/discussions-data/discussions-schema.json

            echo "Using cached data from ${CACHE_BUCKET}"
            echo "Total discussions in cache: $(jq 'length' /tmp/gh-aw/agent/discussions-data/discussions.json)"
          else
            echo "⬇ Downloading fresh discussions data..."

            # Fetch OPEN discussions using GraphQL with pagination (up to GH_AW_DISCUSSIONS_COUNT, default 100)
            DISCUSSIONS_FILE="/tmp/gh-aw/agent/discussions-data/discussions.json"
            echo '[]' > "$DISCUSSIONS_FILE"

            CURSOR=""
            HAS_NEXT_PAGE=true
            PAGE_COUNT=0

            while [ "$HAS_NEXT_PAGE" = "true" ]; do
              if [ -z "$CURSOR" ]; then
                CURSOR_ARG=""
              else
                CURSOR_ARG=", after: \"$CURSOR\""
              fi

              RESULT=$(gh api graphql -f query="
                query {
                  repository(owner: \"$REPO_OWNER\", name: \"$REPO_NAME\") {
                    discussions(first: 100, states: [OPEN]${CURSOR_ARG}) {
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                      nodes {
                        number
                        title
                        body
                        createdAt
                        updatedAt
                        url
                        category {
                          name
                          slug
                        }
                        author {
                          login
                        }
                        labels(first: 10) {
                          nodes {
                            name
                          }
                        }
                      }
                    }
                  }
                }
              ")

              # Extract discussions and normalize structure
              echo "$RESULT" | jq -r '
                .data.repository.discussions.nodes
                | map({
                    number,
                    title,
                    body,
                    createdAt,
                    updatedAt,
                    url,
                    category: .category.name,
                    categorySlug: .category.slug,
                    author: (if .author then .author.login else "unknown" end),
                    labels: [.labels.nodes[].name],
                    isAgenticWorkflow: (if .body then (.body | test("^> AI generated by"; "m")) else false end)
                  })
              ' | jq -s 'add' > /tmp/gh-aw/agent/temp_discussions.json

              # Merge with existing discussions
              jq -s 'add | unique_by(.number)' "$DISCUSSIONS_FILE" /tmp/gh-aw/agent/temp_discussions.json > /tmp/gh-aw/agent/merged.json
              mv /tmp/gh-aw/agent/merged.json "$DISCUSSIONS_FILE"
              rm -f /tmp/gh-aw/agent/temp_discussions.json

              # Check if there are more pages
              HAS_NEXT_PAGE=$(echo "$RESULT" | jq -r '.data.repository.discussions.pageInfo.hasNextPage')
              CURSOR=$(echo "$RESULT" | jq -r '.data.repository.discussions.pageInfo.endCursor')

              # Check if we've reached the requested count
              CURRENT_COUNT=$(jq 'length' "$DISCUSSIONS_FILE")
              MAX_COUNT="${GH_AW_DISCUSSIONS_COUNT:-100}"
              if [ "$CURRENT_COUNT" -ge "$MAX_COUNT" ]; then
                echo "Reached requested discussion count ($MAX_COUNT)"
                # Trim to exact count if we have more
                jq --argjson max "$MAX_COUNT" '.[:$max]' "$DISCUSSIONS_FILE" > /tmp/gh-aw/agent/trimmed.json
                mv /tmp/gh-aw/agent/trimmed.json "$DISCUSSIONS_FILE"
                break
              fi

              # Safety check - break after 10 pages (1000 discussions max regardless of count)
              PAGE_COUNT=$((PAGE_COUNT + 1))
              if [ $PAGE_COUNT -ge 10 ]; then
                echo "Reached pagination limit (10 pages)"
                break
              fi
            done

            # Generate schema for reference
            ./.github/skills/jqschema/jqschema.sh < /tmp/gh-aw/agent/discussions-data/discussions.json > /tmp/gh-aw/agent/discussions-data/discussions-schema.json

            # Store in cache with the current six-hour bucket
            cp /tmp/gh-aw/agent/discussions-data/discussions.json "$CACHE_DIR/discussions-${CACHE_BUCKET}.json"
            cp /tmp/gh-aw/agent/discussions-data/discussions-schema.json "$CACHE_DIR/discussions-${CACHE_BUCKET}-schema.json"

            echo "✓ Discussions data saved to cache: discussions-${CACHE_BUCKET}.json"
            echo "Total discussions found: $(jq 'length' /tmp/gh-aw/agent/discussions-data/discussions.json)"
          fi

          # Always ensure data is available at expected locations for backward compatibility
          echo "Discussions data available at: /tmp/gh-aw/agent/discussions-data/discussions.json"
          echo "Schema available at: /tmp/gh-aw/agent/discussions-data/discussions-schema.json"
      - env:
          GH_AW_ENV_GH_AW_WORKFLOW_ID_SANITIZED: ${{ env.GH_AW_WORKFLOW_ID_SANITIZED }}
        name: Ensure AgentDB cache path
        run: mkdir -p "/tmp/gh-aw/cache-memory/agentdb-$GH_AW_ENV_GH_AW_WORKFLOW_ID_SANITIZED"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Fetch weekly issues
        run: |
          # Create output directories
          mkdir -p /tmp/gh-aw/agent/weekly-issues-data
          mkdir -p /tmp/gh-aw/cache-memory

          # Use UTC six-hour buckets so scheduled reports receive fresh data each run.
          TODAY=$(date -u '+%Y-%m-%d')
          HOUR=$(date -u '+%H')
          HOUR_BUCKET=$(printf '%02d' "$((10#$HOUR / 6 * 6))")
          CACHE_BUCKET="${TODAY}-${HOUR_BUCKET}"
          CACHE_DIR="/tmp/gh-aw/cache-memory"

          # Check if cached data exists from this six-hour bucket
          if [ -f "$CACHE_DIR/weekly-issues-${CACHE_BUCKET}.json" ] && [ -s "$CACHE_DIR/weekly-issues-${CACHE_BUCKET}.json" ]; then
            echo "✓ Found cached weekly issues data from ${CACHE_BUCKET}"
            cp "$CACHE_DIR/weekly-issues-${CACHE_BUCKET}.json" /tmp/gh-aw/agent/weekly-issues-data/issues.json

            # Regenerate schema if missing
            if [ ! -f "$CACHE_DIR/weekly-issues-${CACHE_BUCKET}-schema.json" ]; then
              ./.github/skills/jqschema/jqschema.sh < /tmp/gh-aw/agent/weekly-issues-data/issues.json > "$CACHE_DIR/weekly-issues-${CACHE_BUCKET}-schema.json"
            fi
            cp "$CACHE_DIR/weekly-issues-${CACHE_BUCKET}-schema.json" /tmp/gh-aw/agent/weekly-issues-data/issues-schema.json

            echo "Using cached data from ${CACHE_BUCKET}"
            echo "Total issues in cache: $(jq 'length' /tmp/gh-aw/agent/weekly-issues-data/issues.json)"
          else
            echo "⬇ Downloading fresh weekly issues data..."

            # Calculate date 7 days ago (cross-platform: GNU date first, BSD fallback)
            DATE_7_DAYS_AGO=$(date -d '7 days ago' '+%Y-%m-%d' 2>/dev/null || date -v-7d '+%Y-%m-%d')

            echo "Fetching issues created or updated since ${DATE_7_DAYS_AGO}..."

            # Fetch issues from the last 7 days using gh CLI
            # Using --search with updated filter to get recent activity
            gh issue list --repo "$GITHUB_REPOSITORY" \
              --search "updated:>=${DATE_7_DAYS_AGO}" \
              --state all \
              --json number,title,author,createdAt,state,url,body,labels,updatedAt,closedAt,milestone,assignees,comments \
              --limit 500 \
              > /tmp/gh-aw/agent/weekly-issues-data/issues.json

            # Generate schema for reference
            ./.github/skills/jqschema/jqschema.sh < /tmp/gh-aw/agent/weekly-issues-data/issues.json > /tmp/gh-aw/agent/weekly-issues-data/issues-schema.json

            # Store in cache with the current six-hour bucket
            cp /tmp/gh-aw/agent/weekly-issues-data/issues.json "$CACHE_DIR/weekly-issues-${CACHE_BUCKET}.json"
            cp /tmp/gh-aw/agent/weekly-issues-data/issues-schema.json "$CACHE_DIR/weekly-issues-${CACHE_BUCKET}-schema.json"

            echo "✓ Weekly issues data saved to cache: weekly-issues-${CACHE_BUCKET}.json"
            echo "Total issues found: $(jq 'length' /tmp/gh-aw/agent/weekly-issues-data/issues.json)"
          fi

          # Always ensure data is available at expected locations for backward compatibility
          echo "Weekly issues data available at: /tmp/gh-aw/agent/weekly-issues-data/issues.json"
          echo "Schema available at: /tmp/gh-aw/agent/weekly-issues-data/issues-schema.json"

      - name: Configure Git credentials
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Checkout PR branch
