              let mcpConfig;
              try {
                mcpConfig = JSON.parse(content);
              } catch (error) {
                throw new Error("Failed to parse OpenCode MCP configuration", { cause: error });
              }
              if (!mcpConfig?.mcp?.servers || typeof mcpConfig.mcp.servers !== "object" || Array.isArray(mcpConfig.mcp.servers)) {
