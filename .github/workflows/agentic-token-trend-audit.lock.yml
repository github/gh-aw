          GH_AW_DEFAULT_ADMISSION_ON_OUTAGE: ${{ vars.GH_AW_DEFAULT_ADMISSION_ON_OUTAGE }}
          GH_AW_ADMISSION_WORKFLOW_HASH: "97cc7c84225e3786795b14058e00be0840084e513f7f62da1a3abc5b479a67d7:f040ba83f10a25efabdfa009168bce06f43a32a994e47e25ec9b717a84358e24"
          GH_AW_INFO_WORKFLOW_ID: ${{ job.workflow_ref }}
