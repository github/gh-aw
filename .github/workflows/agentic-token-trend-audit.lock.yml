          WORKFLOW_NAME: "On-Demand Agentic Workflow AIC Trend Audit"
          WORKFLOW_DESCRIPTION: "On-demand AIC audit for a user-specified date range"
          HAS_PATCH: ${{ needs.agent.outputs.has_patch }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
