            ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/firewall/logs/api-proxy-logs/token-usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/firewall/logs/api-proxy-logs/model-routing.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/firewall/audit/api-proxy-logs/token-usage.jsonl
            ${{ env.GH_AW_RUNTIME_ROOT }}/sandbox/firewall/audit/api-proxy-logs/model-routing.jsonl
