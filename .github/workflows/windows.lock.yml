name: "Windows Runner Integration Test"
on:
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string
      topic:
        default: Windows runners
        description: Topic for the haiku
        required: false
        type: string
    outputs:
      created_issue_number:
        description: Number of the first created issue
        value: ${{ jobs.safe_outputs.outputs.created_issue_number }}
      created_issue_url:
        description: URL of the first created issue
        value: ${{ jobs.safe_outputs.outputs.created_issue_url }}
    secrets:
      GH_AW_DEFAULT_OTLP_ENDPOINT:
        required: false
      GH_AW_DEFAULT_OTLP_HEADERS:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string
      topic:
        default: Windows runners
        description: Topic for the haiku
        required: false

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  group: "gh-aw-windows-${{ github.run_id }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}"
  queue: max

run-name: "Windows Runner Integration Test"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
  OTEL_SERVICE_NAME: gh-aw.windows
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Windows%20Runner%20Integration%20Test,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=codex'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_LOGS_ENABLED: ${{ vars.GH_AW_OTLP_LOGS_ENABLED }}
  GH_AW_OTLP_LOGS_MAX_BYTES: ${{ vars.GH_AW_OTLP_LOGS_MAX_BYTES }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

jobs:
  activation:
    name: activation
    needs:
      - admission
      - pre_activation
    if: >
      ((!cancelled()) && (needs.admission.result == 'success' || needs.admission.result == 'skipped') && needs.pre_activation.result == 'success') &&
      (needs.pre_activation.outputs.activated == 'true')
    runs-on: ubuntu-slim
    # Permissions for the activation job (workflow permissions default to none).
    permissions:
      actions: read # Read workflow runs and artifacts for workflow context.
      contents: read
      discussions: write # Create or update discussions and comments.
      issues: write # Create or update issues and comments.
      pull-requests: write # Create or update pull requests and review comments.
    env:
      GH_AW_ADMISSION_RESULT: ${{ needs.admission.outputs.result }}
      GH_AW_MAX_DAILY_AI_CREDITS: ${{ vars.GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS || '5000' }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      admission-max-ai-credits: ${{ needs.admission.outputs.max-ai-credits }}
      admission-max-ai-credits-evals: ${{ needs.admission.outputs.max-ai-credits-evals }}
      admission-max-ai-credits-threat-detection: ${{ needs.admission.outputs.max-ai-credits-threat-detection }}
      admission-result: ${{ needs.admission.outputs.result }}
      artifact_prefix: ${{ steps.artifact-prefix.outputs.prefix }}
      aw_context: ${{ steps.generate_aw_info.outputs.aw_context }}
      body: ${{ steps.sanitized.outputs.body }}
      comment_id: ${{ steps.add-comment.outputs.comment-id }}
      comment_repo: ${{ steps.add-comment.outputs.comment-repo }}
      comment_url: ${{ steps.add-comment.outputs.comment-url }}
      daily_ai_credits_estimated: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_estimated || '' }}
      daily_ai_credits_exceeded: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_exceeded == 'true' }}
      daily_ai_credits_guardrail_error: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_guardrail_error || '' }}
      daily_ai_credits_guardrail_status: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_guardrail_status || '' }}
      daily_ai_credits_threshold: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_threshold || '' }}
      daily_ai_credits_total: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_total || '' }}
      engine_id: ${{ steps.generate_aw_info.outputs.engine_id }}
      lockdown_check_failed: ${{ steps.generate_aw_info.outputs.lockdown_check_failed == 'true' }}
      model: ${{ steps.generate_aw_info.outputs.model }}
      oauth_token_check_failed: ${{ steps.check-oauth-tokens.outputs.oauth_token_check_failed == 'true' }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      slash_command: ${{ needs.pre_activation.outputs.matched_command }}
      stale_lock_file_failed: ${{ steps.check-lock-file.outputs.stale_lock_file_failed == 'true' }}
      target_checkout_ref: ${{ steps.resolve-host-repo.outputs.target_checkout_ref }}
      target_ref: ${{ steps.resolve-host-repo.outputs.target_ref }}
      target_repo: ${{ steps.resolve-host-repo.outputs.target_repo }}
      target_repo_name: ${{ steps.resolve-host-repo.outputs.target_repo_name }}
      text: ${{ steps.sanitized.outputs.text }}
      title: ${{ steps.sanitized.outputs.title }}
    steps:
      - name: Checkout actions folder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          sparse-checkout: |
            actions
          fetch-depth: 1
          clean: false
          persist-credentials: false
      - name: Setup Scripts
        id: setup
        uses: ./actions/setup
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.admission.outputs.trace-id || needs.pre_activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.pre_activation.outputs.setup-parent-span-id || needs.pre_activation.outputs.setup-span-id }}
          safe-output-artifact-client: ${{ env.GH_AW_MAX_DAILY_AI_CREDITS != '' }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Windows Runner Integration Test"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/windows.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.167.0"
          GH_AW_INFO_AWF_VERSION: "v0.29.11"
          GH_AW_INFO_ENGINE_ID: "codex"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Resolve host repo for activation checkout
        id: resolve-host-repo
