      - name: Prepare admission conclusion metadata
        id: admission-conclusion-metadata
        if: always() && vars.GH_AW_DEFAULT_ADMISSION_URL != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('node:path');
            const { readCompactUnifiedSession } = require(path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions', 'compact_unified_session.cjs'));
            const compact = readCompactUnifiedSession('/tmp/gh-aw/usage/aw_session.jsonl');
