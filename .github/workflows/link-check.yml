name: Link Check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.mdx'
      - '.github/workflows/link-check.yml'
      - '.github/.markdown-link-check.json'
  pull_request:
    paths:
      - '**.md'
      - '**.mdx'
      - '.github/workflows/link-check.yml'
      - '.github/.markdown-link-check.json'
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 00:00 UTC to catch stale external links
    - cron: '0 0 * * 0'

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: link-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Markdown links in reports
        # zizmor: ignore[github_action_from_unverified_creator_used]
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: 'no'
          config-file: '.github/.markdown-link-check.json'
          folder-path: 'reports/'
          file-extension: '.md'
      
      - name: Check Markdown links in docs
        # zizmor: ignore[github_action_from_unverified_creator_used]
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: 'no'
          config-file: '.github/.markdown-link-check.json'
          folder-path: 'docs/'
          file-extension: '.md,.mdx'
