name: Daily Windows CLI Integration

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        if: steps.setup-go.outputs.cache-hit != 'true'
        run: go mod download

      - name: Build Windows binary (cross-compile)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags "-s -w" -o gh-aw.exe ./cmd/gh-aw
          echo "✅ Built gh-aw.exe ($(du -h gh-aw.exe | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-aw-windows-amd64
          path: gh-aw.exe
          retention-days: 1

  integration:
    name: Windows Integration Tests
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BINARY: ${{ github.workspace }}\gh-aw.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-aw-windows-amd64

      - name: Verify binary
        shell: pwsh
        run: |
          if (-Not (Test-Path $env:BINARY)) { throw "gh-aw.exe not found at $env:BINARY" }
          $size = (Get-Item $env:BINARY).Length
          Add-Content $env:GITHUB_STEP_SUMMARY "✅ Binary found ($size bytes)"

      - name: Validate scenario coverage and timeout regressions
        shell: pwsh
        run: ./scripts/windows-cli-matrix.test.ps1

      - name: Windows CLI scenario matrix (shell × launch-mode × env-shape × path-style)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          function Invoke-CliProcess {
            param(
              [Parameter(Mandatory)] [string] $FilePath,
              [string[]] $ArgumentList = @(),
              [string] $RawArguments = "",
              [int] $TimeoutMs = 30000,
              [ValidateRange(1, 60000)] [int] $PostExitDrainTimeoutMs = 2000,
              [string] $WorkingDirectory = (Get-Location).Path,
              [hashtable] $EnvironmentOverrides = @{},
              [string[]] $UnsetEnvironment = @(),
              [switch] $MinimalEnvironment,
              [switch] $CloseStandardInput,
              [switch] $ExpectFailure,
              [switch] $AllowFailure,
              [string] $ExpectedErrorPattern = "",
              [switch] $AssertNoAnsi
            )

            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $FilePath
            $psi.WorkingDirectory = $WorkingDirectory
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $CloseStandardInput
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.StandardOutputEncoding = [System.Text.Encoding]::UTF8
            $psi.StandardErrorEncoding = [System.Text.Encoding]::UTF8

            if ($RawArguments) {
              $psi.Arguments = $RawArguments
            } else {
              foreach ($arg in $ArgumentList) {
                [void]$psi.ArgumentList.Add($arg)
              }
            }

            if ($MinimalEnvironment) {
              $psi.Environment.Clear()
              foreach ($key in @("TEMP", "TMP", "SystemRoot")) {
                $value = [System.Environment]::GetEnvironmentVariable($key)
                if ($null -ne $value -and $value -ne "") {
                  $psi.Environment[$key] = $value
                }
              }
            }

            foreach ($key in $UnsetEnvironment) {
              [void]$psi.Environment.Remove($key)
            }
            foreach ($key in $EnvironmentOverrides.Keys) {
              $value = $EnvironmentOverrides[$key]
              if ($null -eq $value) {
                [void]$psi.Environment.Remove($key)
              } else {
                $psi.Environment[$key] = [string]$value
              }
            }

            $displayArgs = if ($RawArguments) { $RawArguments } else { $ArgumentList -join ' ' }

            $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
            $stdoutBuffer = [System.Text.StringBuilder]::new()
            $stderrBuffer = [System.Text.StringBuilder]::new()
            $proc = $null
            try {
              $proc = [System.Diagnostics.Process]::Start($psi)
              if ($CloseStandardInput) {
                $proc.StandardInput.Close()
              }
              $stdoutChars = [char[]]::new(4096)
              $stderrChars = [char[]]::new(4096)
              $stdoutRead = $proc.StandardOutput.ReadAsync($stdoutChars, 0, $stdoutChars.Length)
              $stderrRead = $proc.StandardError.ReadAsync($stderrChars, 0, $stderrChars.Length)
              $stdoutDone = $false
              $stderrDone = $false
              $processTimedOut = $false
              $processCleanupWatch = $null
              $drainWatch = $null
              while ($true) {
                if (-not $stdoutDone -and $stdoutRead.IsCompleted) {
                  $readCount = $stdoutRead.GetAwaiter().GetResult()
                  if ($readCount -eq 0) {
                    $stdoutDone = $true
                  } else {
                    [void]$stdoutBuffer.Append($stdoutChars, 0, $readCount)
                    $stdoutRead = $proc.StandardOutput.ReadAsync($stdoutChars, 0, $stdoutChars.Length)
                  }
                }
                if (-not $stderrDone -and $stderrRead.IsCompleted) {
                  $readCount = $stderrRead.GetAwaiter().GetResult()
                  if ($readCount -eq 0) {
                    $stderrDone = $true
                  } else {
                    [void]$stderrBuffer.Append($stderrChars, 0, $readCount)
                    $stderrRead = $proc.StandardError.ReadAsync($stderrChars, 0, $stderrChars.Length)
                  }
                }

                $processExited = $proc.HasExited
                if ($processExited -and $null -eq $drainWatch) {
                  $drainWatch = [System.Diagnostics.Stopwatch]::StartNew()
                } elseif (-not $processExited -and -not $processTimedOut -and $stopwatch.ElapsedMilliseconds -ge $TimeoutMs) {
                  $processTimedOut = $true
                  $processCleanupWatch = [System.Diagnostics.Stopwatch]::StartNew()
                  try { $proc.Kill($true) } catch {}
                  [void]$proc.WaitForExit(1000)
                  $processExited = $proc.HasExited
                  if ($processExited -and $null -eq $drainWatch) {
                    $drainWatch = [System.Diagnostics.Stopwatch]::StartNew()
                  }
                  continue
                }

                if ($processExited -and $stdoutDone -and $stderrDone) { break }
                if ($processExited -and $drainWatch.ElapsedMilliseconds -ge $PostExitDrainTimeoutMs) { break }
                if ($processTimedOut -and -not $processExited -and $processCleanupWatch.ElapsedMilliseconds -ge 1000) { break }
                Start-Sleep -Milliseconds 10
              }

              $stdout = $stdoutBuffer.ToString()
              $stderr = $stderrBuffer.ToString()
              if (-not $stdoutDone) {
                $reason = if ($processTimedOut) { "capture timed out after process termination" } else { "drain timed out after process exit" }
                if ($stdout) { $stdout += "`n" }
                $stdout += "<stdout $reason>"
              }
              if (-not $stderrDone) {
                $reason = if ($processTimedOut) { "capture timed out after process termination" } else { "drain timed out after process exit" }
                if ($stderr) { $stderr += "`n" }
                $stderr += "<stderr $reason>"
              }
              if ($processTimedOut) {
                $stopwatch.Stop()
                throw "TIMEOUT: '$FilePath $displayArgs' exceeded ${TimeoutMs}ms (elapsed $($stopwatch.ElapsedMilliseconds)ms)`nCaptured output:`n$stdout`n$stderr"
              }
              if (-not $stdoutDone -or -not $stderrDone) {
                $exitCode = $proc.ExitCode
                $stopwatch.Stop()
                throw "OUTPUT DRAIN TIMEOUT: '$FilePath $displayArgs' exited with code $exitCode; stdout/stderr drain exceeded ${PostExitDrainTimeoutMs}ms after process exit (elapsed $($stopwatch.ElapsedMilliseconds)ms)`nCaptured output:`n$stdout`n$stderr"
              }

              $output = "$stdout`n$stderr"
              $exitCode = $proc.ExitCode
              $stopwatch.Stop()
            } finally {
              if ($null -ne $proc) { $proc.Dispose() }
            }

            if ($AssertNoAnsi -and $output -match "\x1B\[[0-9;]*[A-Za-z]") {
              throw "Unexpected ANSI escape sequences for '$FilePath $displayArgs' after $($stopwatch.ElapsedMilliseconds)ms`nCaptured output:`n$output"
            }

            if ($ExpectFailure) {
              if ($exitCode -eq 0) {
                throw "Expected failure but '$FilePath $displayArgs' exited 0 after $($stopwatch.ElapsedMilliseconds)ms`nCaptured output:`n$output"
              }
              if ($ExpectedErrorPattern -and $output -notmatch $ExpectedErrorPattern) {
                throw "Expected error pattern '$ExpectedErrorPattern' not found for '$FilePath $displayArgs' (exit $exitCode, elapsed $($stopwatch.ElapsedMilliseconds)ms)`nCaptured output:`n$output"
              }
            } elseif ($exitCode -ne 0 -and -not $AllowFailure) {
              throw "Exit code $exitCode for '$FilePath $displayArgs' after $($stopwatch.ElapsedMilliseconds)ms`nCaptured output:`n$output"
            }
            if ($AllowFailure -and $exitCode -ne 0 -and $output -notmatch $ExpectedErrorPattern) {
              throw "Unexpected failure for '$FilePath $displayArgs' (exit $exitCode)`nCaptured output:`n$output"
            }

            return @{
              ExitCode            = $exitCode
              Output              = $output
              ElapsedMilliseconds = $stopwatch.ElapsedMilliseconds
            }
          }

          $workspace = $env:GITHUB_WORKSPACE
          $binary = $env:BINARY
          $originalPath = $env:PATH
          $originalPathExt = $env:PATHEXT
          $shellExecutables = @{
            pwsh = (Get-Command pwsh.exe).Source
            powershell = (Get-Command powershell.exe).Source
            cmd = (Get-Command cmd.exe).Source
          }
          $toolcacheDir = Join-Path $env:RUNNER_TEMP "toolcache-like"
          $spaceDir = Join-Path $env:RUNNER_TEMP "path with spaces"
          $parenDir = Join-Path $env:RUNNER_TEMP "Program Files (x86)"
          $unicodeDir = Join-Path $env:TEMP "tëst-dïr-αβγ"
          foreach ($dir in @($toolcacheDir, $spaceDir, $parenDir, $unicodeDir)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }
          Copy-Item -Path $binary -Destination (Join-Path $spaceDir "gh-aw.exe") -Force
          Copy-Item -Path $binary -Destination (Join-Path $parenDir "gh-aw.exe") -Force
          Copy-Item -Path $binary -Destination (Join-Path $toolcacheDir "gh-aw.exe") -Force
          Copy-Item -Path $binary -Destination (Join-Path $unicodeDir "gh-aw.exe") -Force

          . ./scripts/windows-cli-matrix.ps1
          $dimensions = Get-CliScenarioDimensions
          $scenarioMatrix = @(New-CliScenarioMatrix)
          $pairCount = Assert-CliScenarioCoverage -Scenarios $scenarioMatrix
          $dimensionSummary = ($dimensions.Keys | ForEach-Object { "$_=$($dimensions[$_] -join '/')" }) -join "; "
          Add-Content $env:GITHUB_STEP_SUMMARY "Pairwise matrix: $($scenarioMatrix.Count) scenarios, all $pairCount value pairs covered. $dimensionSummary"

          foreach ($scenario in $scenarioMatrix) {
            $pathDirectory = switch ($scenario.path) {
              "spaces" { $spaceDir }
              "parentheses" { $parenDir }
              "mixed-slashes" { $spaceDir -replace "\\", "/" }
              "unicode" { $unicodeDir }
              default { $workspace }
            }
            $scenarioBinary = Join-Path $pathDirectory "gh-aw.exe"
            $basePath = if ($scenario.env -eq "minimal") { "$env:SystemRoot\System32;$env:SystemRoot" } else { $originalPath }
            $scenarioPath = "$pathDirectory;$basePath"
            $expectedExecutable = $scenarioBinary
            switch ($scenario.order) {
              "toolcache-first" {
                $scenarioPath = "$toolcacheDir;$pathDirectory;$basePath"
                $expectedExecutable = Join-Path $toolcacheDir "gh-aw.exe"
              }
              "duplicate-workspace" { $scenarioPath = "$pathDirectory;$pathDirectory;$basePath" }
              "shadow" { $scenarioPath = "$pathDirectory;$toolcacheDir;$basePath" }
            }
            $pathExt = switch ($scenario.pathext) {
              "exe-first" { ".EXE;.CMD;.BAT;.COM" }
              "duplicate-exe" { ".CMD;.EXE;.BAT;.EXE" }
              "missing-exe" { ".CMD;.BAT;.COM" }
              default { $originalPathExt }
            }
            $envOverrides = @{ PATH = $scenarioPath; PATHEXT = $pathExt }
            $unsetVars = @()
            $assertNoAnsi = $false
            $environmentChecks = @{}
            switch ($scenario.env) {
              "minimal" { $environmentChecks = @{ CI = ""; TERM = ""; NO_COLOR = "" } }
              "no-color" { $envOverrides["NO_COLOR"] = "1"; $environmentChecks.NO_COLOR = "1"; $assertNoAnsi = $true }
              "term-dumb" { $envOverrides["TERM"] = "dumb"; $environmentChecks.TERM = "dumb"; $assertNoAnsi = $true }
              "term-unset" { $unsetVars += "TERM"; $environmentChecks.TERM = "" }
              "ci-true" { $envOverrides["CI"] = "true"; $environmentChecks.CI = "true" }
              "ci-unset" { $unsetVars += "CI"; $environmentChecks.CI = "" }
            }
            $invokeOptions = @{
              EnvironmentOverrides = $envOverrides
              UnsetEnvironment = $unsetVars
              MinimalEnvironment = ($scenario.env -eq "minimal")
              AssertNoAnsi = $assertNoAnsi
              # cmd searches its working directory before PATH, unlike PowerShell.
              WorkingDirectory = $env:RUNNER_TEMP
            }
            $target = if ($scenario.launch -eq "path") { "gh-aw" } else { $scenarioBinary }
            # Shells may differ when PATHEXT omits .EXE: accept only verified
            # resolution or a bounded, explicit command-not-found diagnostic.
            $missingExtension = $scenario.launch -eq "path" -and $scenario.pathext -eq "missing-exe"
            if ($missingExtension) {
              $invokeOptions.AllowFailure = $true
              $invokeOptions.ExpectedErrorPattern = "gh-aw.*(not recognized|not found)|not recognized.*gh-aw"
            }
            try {
              if ($scenario.shell -eq "cmd") {
                $resolution = if ($scenario.launch -eq "path") {
                  'for %I in (gh-aw.exe) do @echo RESOLVED=%~$PATH:I'
                } else { "echo RESOLVED=$scenarioBinary" }
                $environmentProbe = ($environmentChecks.Keys | ForEach-Object { "if defined $_ (echo ENV-$_=%$_%) else (echo ENV-$_=) & " }) -join ""
                $command = "chcp 65001 >nul & $environmentProbe$resolution & `"$target`" --help"
                $result = Invoke-CliProcess -FilePath $shellExecutables.cmd -RawArguments "/d /s /c `"$command`"" @invokeOptions
              } else {
                $shellName = if ($scenario.shell.StartsWith("pwsh")) { "pwsh" } else { "powershell" }
                $escapedTarget = $target.Replace("'", "''")
                $resolution = if ($scenario.launch -eq "path") {
                  "[string](Get-Command '$escapedTarget' -CommandType Application -ErrorAction SilentlyContinue).Source"
                } else { "'$($scenarioBinary.Replace("'", "''"))'" }
                $environmentProbe = ($environmentChecks.Keys | ForEach-Object { "Write-Output ('ENV-$_=' + [Environment]::GetEnvironmentVariable('$_')); " }) -join ""
                $command = "`$ErrorActionPreference = 'Stop'; [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new(`$false); $environmentProbe Write-Output ('RESOLVED=' + $resolution); & '$escapedTarget' --help; exit `$LASTEXITCODE"
                $shellArgs = @("-NonInteractive")
                if ($scenario.shell.EndsWith("noprofile")) { $shellArgs += "-NoProfile" }
                $shellArgs += @("-Command", $command)
                $result = Invoke-CliProcess -FilePath $shellExecutables[$shellName] -ArgumentList $shellArgs @invokeOptions
              }
              foreach ($key in $environmentChecks.Keys) {
                if (($result.Output -split "`r?`n").Trim() -cnotcontains "ENV-$key=$($environmentChecks[$key])") {
                  throw "Environment assertion failed for $key`nCaptured output:`n$($result.Output)"
                }
              }
              if ($result.ExitCode -eq 0) {
                if ($scenario.launch -eq "direct") { $expectedExecutable = $scenarioBinary }
                $resolved = [string]($result.Output -split "`r?`n" | Where-Object { $_.StartsWith("RESOLVED=") } | Select-Object -First 1)
                $resolved = $resolved.Trim() -replace "^RESOLVED=", ""
                if (-not [string]::Equals(($resolved -replace "/", "\"), ($expectedExecutable -replace "/", "\"), [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Expected executable '$expectedExecutable', got '$resolved'`nCaptured output:`n$($result.Output)"
                }
                if ($result.Output -notmatch "GitHub Agentic Workflows") {
                  throw "CLI help missing`nCaptured output:`n$($result.Output)"
                }
              }
            } catch {
              Add-Content $env:GITHUB_STEP_SUMMARY "FAILED: $($scenario.name)`n`n$($_.Exception.Message)"
              throw "Scenario '$($scenario.name)' failed: $($_.Exception.Message)"
            }
            Add-Content $env:GITHUB_STEP_SUMMARY "✅ Matrix scenario passed: $($scenario.name) (exit=$($result.ExitCode), $($result.ElapsedMilliseconds)ms)"
          }

          $env:PATH = "$workspace;$originalPath"
          $env:PATHEXT = $originalPathExt
          if ($env:PATHEXT -notmatch "(?i)\.EXE") {
            throw "PATHEXT missing .EXE"
          }
          Invoke-CliProcess -FilePath "pwsh" -ArgumentList @("-NoProfile", "-Command", "& gh-aw --help") | Out-Null
          Invoke-CliProcess -FilePath "cmd" -ArgumentList @("/d", "/s", "/c", "gh-aw --help") | Out-Null
          Add-Content $env:GITHUB_STEP_SUMMARY "✅ PATHEXT/extension resolution checks passed from pwsh and cmd"

          $spaceBinary = Join-Path $spaceDir "gh-aw.exe"
          $spaceBinaryForwardSlashes = $spaceBinary -replace "\\", "/"
          $parenBinary = Join-Path $parenDir "gh-aw.exe"
          Invoke-CliProcess -FilePath $spaceBinary -ArgumentList @("--help") | Out-Null
          Invoke-CliProcess -FilePath $spaceBinaryForwardSlashes -ArgumentList @("--help") | Out-Null
          Invoke-CliProcess -FilePath $parenBinary -ArgumentList @("--help") | Out-Null
          Add-Content $env:GITHUB_STEP_SUMMARY "✅ Paths with spaces, mixed slashes, and parentheses passed"

          Invoke-CliProcess -FilePath $binary -ArgumentList @("--help") -WorkingDirectory $unicodeDir | Out-Null
          Add-Content $env:GITHUB_STEP_SUMMARY "✅ Unicode working directory check passed ($unicodeDir)"

          Invoke-CliProcess -FilePath $binary -ArgumentList @("--help") -MinimalEnvironment | Out-Null
          Add-Content $env:GITHUB_STEP_SUMMARY "✅ Minimal environment execution passed"

          foreach ($command in @(
            @{ name = "--help"; args = @("--help") },
            @{ name = "version"; args = @("version") },
            @{ name = "compile --help"; args = @("compile", "--help") },
            @{ name = "help"; args = @("help") },
            @{ name = "run --help"; args = @("run", "--help") }
          )) {
            Invoke-CliProcess -FilePath $binary -ArgumentList $command.args | Out-Null
            Add-Content $env:GITHUB_STEP_SUMMARY "✅ Command variant passed: $($command.name)"
          }

          Invoke-CliProcess -FilePath $binary -ArgumentList @("totally-unknown-subcommand-xyz") -TimeoutMs 10000 -ExpectFailure -ExpectedErrorPattern "unknown|not found|invalid|unrecognized" | Out-Null
          Add-Content $env:GITHUB_STEP_SUMMARY "✅ Unknown subcommand fails fast with explicit error output"

          $terminalCommand = "'$binary' new (CI=true; stdin closed; stdout/stderr redirected)"
          $terminalStopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            $terminalResult = Invoke-CliProcess -FilePath $binary -ArgumentList @("new") -TimeoutMs 5000 -EnvironmentOverrides @{ CI = "true" } -CloseStandardInput -ExpectFailure -ExpectedErrorPattern ([regex]::Escape("interactive mode cannot be used in CI environments. Please provide a workflow name"))
            $terminalStopwatch.Stop()
            $terminalOutput = ($terminalResult.Output.Trim() -replace "[\r\n]+", " ")
            Add-Content $env:GITHUB_STEP_SUMMARY "✅ Controlled no-TTY scenario passed: command=$terminalCommand, elapsed=$($terminalResult.ElapsedMilliseconds)ms, exit=$($terminalResult.ExitCode), output=$terminalOutput"
          } catch {
            $terminalStopwatch.Stop()
            $failureDetails = $_.Exception.Message -replace "[\r\n]+", " "
            throw "Controlled no-TTY scenario failed: command=$terminalCommand, elapsed=$($terminalStopwatch.ElapsedMilliseconds)ms, captured output/error=$failureDetails"
          }

      - name: Configure ConPTY
        shell: pwsh
        run: |
          New-Item -Path HKCU:\Console -Force | Out-Null
          Set-ItemProperty -Path HKCU:\Console -Name ForceV2 -Type DWord -Value 1
          Set-ItemProperty -Path HKCU:\Console -Name VirtualTerminalLevel -Type DWord -Value 1
          Add-Content -Path $env:GITHUB_ENV -Value "TERM=xterm"
          Add-Content -Path $env:GITHUB_ENV -Value "CONEMUANSI=ON"
          Add-Content $env:GITHUB_STEP_SUMMARY "✅ Configured HKCU\Console for ConPTY (ForceV2=1, VirtualTerminalLevel=1)"

      - name: "[ConPTY] startup probe hang detection"
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          Add-Type -TypeDefinition @"
          using System;
          using System.ComponentModel;
          using System.Diagnostics;
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Threading.Tasks;
          using Microsoft.Win32.SafeHandles;

          public static class ConPtySmoke
          {
              private const int EXTENDED_STARTUPINFO_PRESENT = 0x00080000;
              private const int PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE = 0x00020016;
              private const uint WAIT_TIMEOUT = 0x00000102;

              [StructLayout(LayoutKind.Sequential)]
              private struct COORD
              {
                  public short X;
                  public short Y;

                  public COORD(short x, short y)
                  {
                      X = x;
                      Y = y;
                  }
              }

              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              private struct STARTUPINFO
              {
                  public int cb;
                  public string lpReserved;
                  public string lpDesktop;
                  public string lpTitle;
                  public int dwX;
                  public int dwY;
                  public int dwXSize;
                  public int dwYSize;
                  public int dwXCountChars;
                  public int dwYCountChars;
                  public int dwFillAttribute;
                  public int dwFlags;
                  public short wShowWindow;
                  public short cbReserved2;
                  public IntPtr lpReserved2;
                  public IntPtr hStdInput;
                  public IntPtr hStdOutput;
                  public IntPtr hStdError;
              }

              [StructLayout(LayoutKind.Sequential)]
              private struct STARTUPINFOEX
              {
                  public STARTUPINFO StartupInfo;
                  public IntPtr lpAttributeList;
              }

              [StructLayout(LayoutKind.Sequential)]
              private struct PROCESS_INFORMATION
              {
                  public IntPtr hProcess;
                  public IntPtr hThread;
                  public int dwProcessId;
                  public int dwThreadId;
              }

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool CreatePipe(out IntPtr hReadPipe, out IntPtr hWritePipe, IntPtr lpPipeAttributes, int nSize);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern int CreatePseudoConsole(COORD size, IntPtr hInput, IntPtr hOutput, uint dwFlags, out IntPtr hPC);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern void ClosePseudoConsole(IntPtr hPC);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool InitializeProcThreadAttributeList(IntPtr lpAttributeList, int dwAttributeCount, int dwFlags, ref IntPtr lpSize);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool UpdateProcThreadAttribute(IntPtr lpAttributeList, uint dwFlags, IntPtr attribute, IntPtr lpValue, IntPtr cbSize, IntPtr lpPreviousValue, IntPtr lpReturnSize);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern void DeleteProcThreadAttributeList(IntPtr lpAttributeList);

              [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
              private static extern bool CreateProcessW(
                  string lpApplicationName,
                  StringBuilder lpCommandLine,
                  IntPtr lpProcessAttributes,
                  IntPtr lpThreadAttributes,
                  bool bInheritHandles,
                  int dwCreationFlags,
                  IntPtr lpEnvironment,
                  string lpCurrentDirectory,
                  ref STARTUPINFOEX lpStartupInfo,
                  out PROCESS_INFORMATION lpProcessInformation);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern uint WaitForSingleObject(IntPtr hHandle, uint dwMilliseconds);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool GetExitCodeProcess(IntPtr hProcess, out int lpExitCode);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool TerminateProcess(IntPtr hProcess, uint uExitCode);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool CloseHandle(IntPtr hObject);

              private static void ThrowLastWin32(string operation)
              {
                  int err = Marshal.GetLastWin32Error();
                  string sysMsg = new Win32Exception(err).Message;
                  throw new Win32Exception(err, $"{operation}: {sysMsg}");
              }

              public static string DrainOutput(Task closeTask, Task readTask, StringBuilder captured, int drainTimeoutMs, string childTimeout)
              {
                  string drainError = null;
                  try
                  {
                      if (!Task.WhenAll(closeTask, readTask).Wait(drainTimeoutMs))
                          drainError = $"ConPTY output drain/close timed out after {drainTimeoutMs}ms";
                  }
                  catch (AggregateException ex)
                  {
                      drainError = $"ConPTY output drain/close failed: {ex.GetBaseException().Message}";
                  }
                  string output;
                  lock (captured) output = captured.ToString();
                  if (!string.IsNullOrEmpty(childTimeout))
                      throw new TimeoutException($"{childTimeout}\n{drainError}\nCaptured output:\n{output}");
                  if (drainError != null)
                      throw new TimeoutException($"{drainError}\nCaptured output:\n{output}");
                  return output;
              }

              public static string Run(string fileName, string arguments, int timeoutMs)
              {
                  IntPtr stdinRead = IntPtr.Zero;
                  IntPtr stdinWrite = IntPtr.Zero;
                  IntPtr stdoutRead = IntPtr.Zero;
                  IntPtr stdoutWrite = IntPtr.Zero;
                  IntPtr pseudoConsole = IntPtr.Zero;
                  IntPtr attributeList = IntPtr.Zero;
                  bool attributeListInitialized = false;
                  IntPtr pseudoConsoleValuePtr = IntPtr.Zero;
                  PROCESS_INFORMATION processInfo = default;

                  try
                  {
                      if (!CreatePipe(out stdinRead, out stdinWrite, IntPtr.Zero, 0))
                      {
                          ThrowLastWin32("CreatePipe(stdin)");
                      }
                      if (!CreatePipe(out stdoutRead, out stdoutWrite, IntPtr.Zero, 0))
                      {
                          ThrowLastWin32("CreatePipe(stdout)");
                      }

                      int hresult = CreatePseudoConsole(new COORD(120, 40), stdinRead, stdoutWrite, 0, out pseudoConsole);
                      if (hresult != 0)
                      {
                          Marshal.ThrowExceptionForHR(hresult);
                      }

                      CloseHandle(stdinRead);
                      stdinRead = IntPtr.Zero;
                      CloseHandle(stdoutWrite);
                      stdoutWrite = IntPtr.Zero;

                      IntPtr attributeListSize = IntPtr.Zero;
                      InitializeProcThreadAttributeList(IntPtr.Zero, 1, 0, ref attributeListSize);
                      attributeList = Marshal.AllocHGlobal(attributeListSize);
                      if (!InitializeProcThreadAttributeList(attributeList, 1, 0, ref attributeListSize))
                      {
                          ThrowLastWin32("InitializeProcThreadAttributeList");
                      }
                      attributeListInitialized = true;

                      IntPtr pseudoConsoleValue = pseudoConsole;
                      pseudoConsoleValuePtr = Marshal.AllocHGlobal(IntPtr.Size);
                      Marshal.WriteIntPtr(pseudoConsoleValuePtr, pseudoConsoleValue);
                      if (!UpdateProcThreadAttribute(
                          attributeList,
                          0,
                          (IntPtr)PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE,
                          pseudoConsoleValuePtr,
                          (IntPtr)IntPtr.Size,
                          IntPtr.Zero,
                          IntPtr.Zero))
                      {
                          ThrowLastWin32("UpdateProcThreadAttribute");
                      }

                      STARTUPINFOEX startupInfo = new STARTUPINFOEX();
                      startupInfo.StartupInfo.cb = Marshal.SizeOf<STARTUPINFOEX>();
                      startupInfo.lpAttributeList = attributeList;

                      string escapedArguments = string.IsNullOrWhiteSpace(arguments) ? string.Empty : " " + arguments;
                      StringBuilder commandLine = new StringBuilder("\"" + fileName + "\"" + escapedArguments);
                      if (!CreateProcessW(
                          null,
                          commandLine,
                          IntPtr.Zero,
                          IntPtr.Zero,
                          false,
                          EXTENDED_STARTUPINFO_PRESENT,
                          IntPtr.Zero,
                          Path.GetDirectoryName(fileName),
                          ref startupInfo,
                          out processInfo))
                      {
                          ThrowLastWin32("CreateProcessW");
                      }

                      CloseHandle(stdinWrite);
                      stdinWrite = IntPtr.Zero;

                      FileStream outputStream = new FileStream(new SafeFileHandle(stdoutRead, ownsHandle: true), FileAccess.Read);
                      stdoutRead = IntPtr.Zero;
                      StreamReader reader = new StreamReader(outputStream, Encoding.UTF8);
                      StringBuilder captured = new StringBuilder();
                      Task readTask = Task.Run(async () =>
                      {
                          char[] buffer = new char[4096];
                          try
                          {
                              int count;
                              while ((count = await reader.ReadAsync(buffer, 0, buffer.Length)) != 0)
                                  lock (captured) captured.Append(buffer, 0, count);
                          }
                          finally
                          {
                              reader.Dispose();
                          }
                      });

                      uint waitResult = WaitForSingleObject(processInfo.hProcess, unchecked((uint)timeoutMs));
                      string childTimeout = null;
                      if (waitResult == WAIT_TIMEOUT)
                      {
                          childTimeout = $"ConPTY child timed out after {timeoutMs}ms for: {commandLine}";
                          if (!TerminateProcess(processInfo.hProcess, 1))
                          {
                              int err = Marshal.GetLastWin32Error();
                              childTimeout += $"; TerminateProcess: {new Win32Exception(err).Message} ({err})";
                          }
                      }
                      else if (waitResult != 0)
                      {
                          ThrowLastWin32("WaitForSingleObject");
                      }

                      // ClosePseudoConsole can itself wait for the output pipe.
                      // Keep the reader alive while closing, but bound both waits.
                      IntPtr consoleToClose = pseudoConsole;
                      pseudoConsole = IntPtr.Zero;
                      Task closeTask = Task.Run(() => ClosePseudoConsole(consoleToClose));
                      string output = DrainOutput(closeTask, readTask, captured, 2000, childTimeout);
                      if (!GetExitCodeProcess(processInfo.hProcess, out int exitCode))
                      {
                          ThrowLastWin32("GetExitCodeProcess");
                      }
                      if (exitCode != 0)
                      {
                          throw new InvalidOperationException($"ConPTY child exited with code {exitCode}: {commandLine}\n{output}");
                      }

                      return output;
                  }
                  finally
                  {
                      if (processInfo.hThread != IntPtr.Zero) CloseHandle(processInfo.hThread);
                      if (processInfo.hProcess != IntPtr.Zero) CloseHandle(processInfo.hProcess);
                      if (pseudoConsole != IntPtr.Zero)
                      {
                          IntPtr consoleToClose = pseudoConsole;
                          Task.Run(() => ClosePseudoConsole(consoleToClose));
                      }
                      if (attributeList != IntPtr.Zero)
                      {
                          if (attributeListInitialized) DeleteProcThreadAttributeList(attributeList);
                          Marshal.FreeHGlobal(attributeList);
                      }
                      if (pseudoConsoleValuePtr != IntPtr.Zero) Marshal.FreeHGlobal(pseudoConsoleValuePtr);
                      if (stdinRead != IntPtr.Zero) CloseHandle(stdinRead);
                      if (stdinWrite != IntPtr.Zero) CloseHandle(stdinWrite);
                      if (stdoutRead != IntPtr.Zero) CloseHandle(stdoutRead);
                      if (stdoutWrite != IntPtr.Zero) CloseHandle(stdoutWrite);
                  }
              }
          }
          "@

          # Allow slightly more time than the redirected-stdio checks because the
          # ConPTY host and child process are both created within this smoke test.
          $conPtyTimeoutMs = 15000
          foreach ($command in @(
            @{ name = "--help"; args = "--help"; expected = "GitHub Agentic Workflows" },
            @{ name = "version"; args = "version"; expected = "gh aw version " }
          )) {
            try {
              $output = [ConPtySmoke]::Run($env:BINARY, $command.args, $conPtyTimeoutMs)
            } catch {
              $message = $_.Exception.ToString()
              if ($message -match '(?i)(-1073741502|0xC0000142|STATUS_DLL_INIT_FAILED)') {
                Add-Content $env:GITHUB_STEP_SUMMARY "⚠️ ConPTY probe skipped for $($command.name): runner returned STATUS_DLL_INIT_FAILED (0xC0000142)"
                continue
              }
              throw
            }
            $cleanOutput = $output -replace "`e\[[\d;]*[A-Za-z]", ""
            if ($cleanOutput -notmatch [regex]::Escape($command.expected)) {
              throw "Expected ConPTY output for '$($command.name)' to contain '$($command.expected)', got:`n$cleanOutput"
            }
            Add-Content $env:GITHUB_STEP_SUMMARY "✅ ConPTY scenario passed: $($command.name)"
          }

      # Explicit check for stdin-blocking hang (common bubbletea/TUI regression)
      - name: "[pwsh] stdin hang detection"
        shell: pwsh
        run: |
          $psi = [System.Diagnostics.ProcessStartInfo]::new($env:BINARY, "--help")
          $psi.RedirectStandardInput = $true
          $psi.UseShellExecute = $false
          $proc = [System.Diagnostics.Process]::Start($psi)
          $proc.StandardInput.Close()
          if (-Not $proc.WaitForExit(15000)) {
            $proc.Kill()
            throw "HANG DETECTED: binary blocked on stdin - TUI may be reading terminal input inappropriately"
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "✅ [pwsh] No stdin hang detected"

      - name: Integration summary
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Windows Integration Results"
          Add-Content $env:GITHUB_STEP_SUMMARY "Completed: $(Get-Date -AsUTC -Format 'yyyy-MM-dd HH:mm:ss') UTC"

  conclusion:
    name: Conclusion
    runs-on: ubuntu-latest
    if: always()
    needs: [build, integration]
    timeout-minutes: 5
    permissions:
      contents: read
      # Scoped to this job only (build/integration stay contents:read) and used
      # solely by the failure-issue step below to dedupe/create a tracking issue.
      issues: write
    steps:
      - name: Evaluate outcomes
        id: evaluate
        run: |
          set -euo pipefail
          BUILD="${{ needs.build.result }}"
          INTEGRATION="${{ needs.integration.result }}"
          FAILED=""
          if [[ "$BUILD" != "success" ]]; then FAILED="build($BUILD)"; fi
          if [[ "$INTEGRATION" != "success" ]]; then FAILED="${FAILED:+$FAILED, }integration($INTEGRATION)"; fi
          if [[ -n "$FAILED" ]]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "failed_jobs=$FAILED" >> "$GITHUB_OUTPUT"
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            {
              echo "❌ Failed jobs: $FAILED"
              echo ""
              echo "Run: [§${GITHUB_RUN_ID}](${RUN_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "✅ All Windows integration jobs passed" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Minimal-permission failure reporting: only this step (and only on failure)
      # uses issues:write. Reuses an existing open tracking issue when one exists
      # so repeated scheduled failures don't spam new issues (see #66441).
      - name: Create or update failure issue
        if: steps.evaluate.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_JOBS: ${{ steps.evaluate.outputs.failed_jobs }}
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TITLE="❌ Windows CLI integration failing"
          BODY=$(cat <<EOF
          ### Windows CLI Integration Failure

          **Failed jobs:** ${FAILED_JOBS}

          **Run:** [§${GITHUB_RUN_ID}](${RUN_URL})

          **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')

          This issue was created automatically by the daily Windows CLI integration workflow and is reused for subsequent failures until closed.
          EOF
          )

          EXISTING=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "${GITHUB_REPOSITORY}" --body "$BODY"
            echo "🔁 Updated existing tracking issue #${EXISTING}" >> "$GITHUB_STEP_SUMMARY"
          else
            NEW_URL=$(gh issue create --repo "${GITHUB_REPOSITORY}" --title "$TITLE" --body "$BODY" --label "bug")
            echo "🆕 Created tracking issue: ${NEW_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if any job failed
        if: steps.evaluate.outputs.failed == 'true'
        run: exit 1
