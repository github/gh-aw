        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'parse_mcp_gateway_log.cjs'));
            await main();
      - name: Parse BinEval results
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_EVALS_QUESTIONS: '[{"id":"performance_data_collected","question":"Did the agent collect performance data for the 90-day window?"},{"id":"summary_with_charts_created","question":"Was a daily performance summary with trend charts produced?"}]'
          GH_AW_EVALS_MODEL: "openai/gpt-5.4"
          GH_AW_EVALS_PHASE: parse
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'run_evals.cjs'));
            await main();
      - name: Redact secrets in evals results
        id: redact_evals_results
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
