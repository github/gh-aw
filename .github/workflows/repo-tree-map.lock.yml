        run: |
          finish_intent_dir="$(dirname "$GH_AW_SAFE_OUTPUTS")/work-queue"
          if cp "$finish_intent_dir/work-queue.finish.jsonl" /tmp/gh-aw/work-queue.finish.jsonl 2>/dev/null; then
            echo 'Work queue: copied finish intent into agent artifact'
