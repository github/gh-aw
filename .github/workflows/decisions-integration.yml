name: Copilot Decisions API Integration

on:
  schedule:
    - cron: '17 6 * * *' # Daily at 06:17 UTC.
  workflow_dispatch:

permissions: {}

jobs:
  decisions-integration:
    name: Copilot Decisions API Integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    concurrency:
      group: ci-${{ github.ref }}-decisions-integration
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Run live Decisions client integration test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --test actions/setup/js/scripts/test_decisions_client.cjs
