          GH_AW_LEDGER_COMPACTION_CONFIG: |-
            {
              "branch_name": "ledgers/smoke",
              "compaction": {
                "schedule": "daily",
                "min_segments": 32,
                "max_segments": 128
              },
              "key": "workflow_run_id",
              "max_patch_kb": 10,
              "max_record_kb": 4,
              "max_segment_kb": 100,
              "name": "smoke",
              "schema": {
                "additionalProperties": false,
                "properties": {
                  "record_type": {
                    "enum": [
                      "repo_memory_ledger_smoke"
                    ]
                  },
                  "result": {
                    "enum": [
                      "passed"
                    ]
                  },
                  "workflow_run_id": {
                    "type": "string"
                  }
                },
                "required": [
                  "record_type",
                  "workflow_run_id",
                  "result"
                ],
                "type": "object"
              },
              "type": "table"
            }
          GH_AW_LEDGER_COMPACTION_TRIGGER: ${{ inputs.operation == 'compact_ledger' && 'requested' || 'scheduled' }}
          GH_AW_LEDGER_COMPACTION_PLAN_FILE: ${{ runner.temp }}/gh-aw/ledger-compaction/plan-5.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'ledger_compaction_apply.cjs'));
            await main();
      - name: Report ledger compaction application failures
        if: ${{ steps.apply_0.outcome == 'failure' || steps.apply_1.outcome == 'failure' || steps.apply_2.outcome == 'failure' || steps.apply_3.outcome == 'failure' || steps.apply_4.outcome == 'failure' || steps.apply_5.outcome == 'failure' }}
        run: exit 1
