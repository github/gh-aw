            const { main } = require(path.join(actionsDir, 'disable_agentic_workflow.cjs'));
            await main();

  label_apply_safe_outputs:
    name: Apply safe outputs by label
    if: ${{ (!(github.event.repository.fork)) && github.event_name == 'issues' && github.event.label.name == 'agentic-workflows:apply-safe-outputs' }}
    runs-on: ubuntu-slim
    # Applying safe outputs can update each supported repository resource.
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout actions folder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
