        timeout-minutes: 15
        id: plan_0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AW_LEDGER_COMPACTION_CONFIG: |-
            {
              "branch_name": "ledgers/audit-history",
              "compaction": {
                "schedule": "daily",
                "min_segments": 32,
                "max_segments": 128
              },
              "key": "run_id",
              "max_patch_kb": 10,
              "max_record_kb": 16,
              "max_segment_kb": 100,
              "name": "audit-history",
              "schema": {
                "additionalProperties": false,
                "properties": {
                  "aggregate_metrics": {
                    "type": "object"
                  },
                  "anomaly_ids": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "audit_window": {
                    "additionalProperties": false,
                    "properties": {
                      "end": {
                        "type": "string"
                      },
                      "start": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "audited_at": {
                    "type": "string"
                  },
                  "finding_ids": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "outcome": {
                    "enum": [
                      "findings_reported",
                      "noop"
                    ]
                  },
                  "recommendation_ids": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "record_type": {
                    "enum": [
                      "workflow_run_audit"
                    ]
                  },
                  "recurring_finding_ids": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "run_id": {
                    "type": "string"
                  },
                  "runs_reviewed": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": [
                  "record_type",
                  "run_id",
                  "audited_at",
                  "audit_window",
                  "runs_reviewed",
                  "aggregate_metrics",
                  "finding_ids",
                  "recommendation_ids",
                  "anomaly_ids",
                  "recurring_finding_ids",
                  "outcome"
                ],
                "type": "object"
              },
              "type": "table"
            }
          GH_AW_LEDGER_COMPACTION_TRIGGER: ${{ inputs.operation == 'compact_ledger' && 'requested' || 'scheduled' }}
          GH_AW_LEDGER_COMPACTION_PLAN_FILE: ${{ runner.temp }}/gh-aw/ledger-compaction/plan-0.json
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'ledger_compaction_plan.cjs'));
            await main();

      - name: Plan ledger compaction (awf-feature-reviews, untrusted, read-only)
        if: ${{ inputs.operation != 'compact_ledger' || inputs.ledger == '' || inputs.ledger == 'awf-feature-reviews' }}
        continue-on-error: true
        timeout-minutes: 15
        id: plan_1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AW_LEDGER_COMPACTION_CONFIG: |-
            {
              "branch_name": "ledgers/awf-feature-reviews",
              "compaction": {
                "schedule": "daily",
                "min_segments": 32,
                "max_segments": 128
              },
              "max_patch_kb": 10,
              "max_record_kb": 8,
              "max_segment_kb": 100,
              "name": "awf-feature-reviews"
            }
          GH_AW_LEDGER_COMPACTION_TRIGGER: ${{ inputs.operation == 'compact_ledger' && 'requested' || 'scheduled' }}
          GH_AW_LEDGER_COMPACTION_PLAN_FILE: ${{ runner.temp }}/gh-aw/ledger-compaction/plan-1.json
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'ledger_compaction_plan.cjs'));
            await main();

      - name: Plan ledger compaction (caveman-run-history, untrusted, read-only)
        if: ${{ inputs.operation != 'compact_ledger' || inputs.ledger == '' || inputs.ledger == 'caveman-run-history' }}
        continue-on-error: true
        timeout-minutes: 15
        id: plan_2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AW_LEDGER_COMPACTION_CONFIG: |-
            {
              "branch_name": "ledgers/caveman-run-history",
              "compaction": {
                "schedule": "daily",
                "min_segments": 32,
                "max_segments": 128
              },
              "key": "run_id",
              "max_patch_kb": 10,
              "max_record_kb": 4,
              "max_segment_kb": 100,
              "name": "caveman-run-history",
              "schema": {
                "additionalProperties": false,
                "properties": {
                  "date": {
                    "type": "string"
                  },
