  label_disable_agentic_workflow:
    name: Disable agentic workflow by label
    if: ${{ (!(github.event.repository.fork)) && github.event_name == 'issues' && github.event.label.name == 'agentic-workflows:disable' }}
    runs-on: ubuntu-slim
    # Label requests disable workflow runs and update the requesting issue.
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Checkout actions folder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
