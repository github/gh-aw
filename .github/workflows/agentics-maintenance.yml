        uses: ./actions/setup
        with:
          destination: ${{ runner.temp }}/gh-aw/actions

      - name: Plan ledger compaction (audit-history, untrusted, read-only)
        if: ${{ inputs.operation != 'compact_ledger' || inputs.ledger == '' || inputs.ledger == 'audit-history' }}
