name: Test Connectors

on:
  schedule:
    - cron: '11 2 * * *'
  pull_request:
    paths:
      - '.github/workflows/connectors/**'
      - '.github/workflows/test-connectors.yml'
      - '.github/workflows/connector-*-conformance.yml'
      - '.github/workflows/test-connector-conformance.yml'
      - 'actions/setup/setup.sh'
      - 'actions/setup/js/connector*'
      - 'actions/setup/js/setup_sh_file_lists.test.cjs'
      - 'pkg/cli/workflows/*-golden.md'
      - 'pkg/connectors/**'
      - 'pkg/cli/*connector*'
      - 'pkg/workflow/*connector*'
      - 'pkg/workflow/*node*_test.go'
      - 'pkg/workflow/*documentation*_test.go'
      - 'pkg/parser/*connector*'
      - 'pkg/parser/schemas/main_workflow_schema.json'
      - 'go.mod'
      - 'go.sum'
  push:
    paths:
      - '.github/workflows/connectors/**'
      - '.github/workflows/test-connectors.yml'
      - '.github/workflows/connector-*-conformance.yml'
      - '.github/workflows/test-connector-conformance.yml'
      - 'actions/setup/setup.sh'
      - 'actions/setup/js/connector*'
      - 'actions/setup/js/setup_sh_file_lists.test.cjs'
      - 'pkg/cli/workflows/*-golden.md'
      - 'pkg/connectors/**'
      - 'pkg/cli/*connector*'
      - 'pkg/workflow/*connector*'
      - 'pkg/workflow/*node*_test.go'
      - 'pkg/workflow/*documentation*_test.go'
      - 'pkg/parser/*connector*'
      - 'pkg/parser/schemas/main_workflow_schema.json'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      provider:
        description: Optional live check requiring provider credentials and scopes; offline tests always run
        type: choice
        options: [none, linear, jira, azure-devops]
        default: none
      resource_id:
        description: Approved Linear issue UUID or Jira issue key
        type: string
      scope_id:
        description: Linear organization UUID or Jira cloud ID
        type: string
      organization:
        description: Azure DevOps organization name (not a URL)
        type: string

permissions:
  contents: read

jobs:
  discover:
    name: Discover connector declarations
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.providers.outputs.providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: providers
        name: Build provider matrix from declarations
        shell: bash
        run: |
          set -euo pipefail
          providers=()
          while IFS= read -r -d '' declaration; do
            provider=${declaration##*/}
            provider=${provider%.md}
            if [[ ! "$provider" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]]; then
              echo "::error::Invalid connector declaration name"
              exit 1
            fi
            providers+=("$provider")
          done < <(find .github/workflows/connectors -maxdepth 1 -type f -name '*.md' -print0 | sort -z)
          if ((${#providers[@]} == 0)); then
            echo "::error::No connector declarations found"
            exit 1
          fi
          providers_json=""
          for provider in "${providers[@]}"; do
            providers_json+="${providers_json:+,}\"${provider}\""
          done
          printf 'providers=[%s]\n' "$providers_json" >> "$GITHUB_OUTPUT"

  conformance:
    name: Conformance (${{ matrix.provider }})
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.discover.outputs.providers) }}
    uses: ./.github/workflows/test-connector-conformance.yml
    with:
      provider: ${{ matrix.provider }}

  offline:
    name: Offline connector conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test scoped runtimes and provider fixtures
        run: go test -race ./pkg/connectors -count=1 -timeout=5m
      - name: Test Markdown imports, compiler, schema, and CLI
        run: >-
          go test ./pkg/workflow ./pkg/parser ./pkg/cli
          -run 'Connector|ProviderDocumentation|Linear|Jira|AzureDevOps|Slack|Teams|Confluence|Sentry|ServiceNow|Servicenow|GitLab|PagerDuty|Datadog|Zendesk|Notion'
          -count=1 -timeout=5m

  live:
    name: Explicit read-only provider smoke test
    if: >-
      !github.event.repository.fork &&
      github.event_name == 'workflow_dispatch' &&
      inputs.provider != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(format('["{0}"]', inputs.provider)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Read through the compiled connector plan
        env:
          GH_AW_CONNECTOR_PROVIDER: ${{ matrix.provider }}
          GH_AW_CONNECTOR_TRACE: "true"
          GH_AW_CONNECTOR_RESOURCE_ID: ${{ inputs.resource_id }}
          GH_AW_CONNECTOR_SCOPE_ID: ${{ inputs.scope_id }}
          GH_AW_CONNECTOR_ORGANIZATION: ${{ inputs.organization }}
          LINEAR_READ_API_KEY: ${{ matrix.provider == 'linear' && secrets.LINEAR_API_KEY || '' }}
          LINEAR_TEAM_ID: ${{ matrix.provider == 'linear' && secrets.LINEAR_TEAM_ID || '' }}
          JIRA_USER_EMAIL: ${{ matrix.provider == 'jira' && secrets.JIRA_USER_EMAIL || '' }}
          JIRA_API_TOKEN: ${{ matrix.provider == 'jira' && secrets.JIRA_API_TOKEN || '' }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || 'https://pelidehalleux.atlassian.net' }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'KAN' }}
          AZURE_DEVOPS_MCP_ENTRA_TOKEN: ${{ matrix.provider == 'azure-devops' && secrets.AZURE_DEVOPS_MCP_ENTRA_TOKEN || '' }}
        run: go test ./pkg/workflow -run '^TestConnectorLiveProvider$' -v -count=1 -timeout=90s

  report-failure:
    name: Report scheduled conformance failure
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.discover.result == 'failure' || needs.conformance.result == 'failure' ||
       needs.offline.result == 'failure' || needs.live.result == 'failure')
    needs: [discover, conformance, offline, live]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing_issue=$(gh issue list --state open --limit 1 \
            --search 'in:title "[Connector Conformance] daily checks failed"' \
            --json number --jq '.[0].number // empty')
          body=$(printf 'Connector conformance failed. Review the [workflow run](%s/%s/actions/runs/%s) for details.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if [[ -n "$existing_issue" ]]; then
            gh issue comment "$existing_issue" --body "$body"
          else
            gh issue create \
              --title '[Connector Conformance] daily checks failed' \
              --body "$body"
          fi
