name: CJS

on:
  push:
    branches: [main]
    paths:
      - 'actions/setup/js/**'
      - 'actions/setup/md/**'
      - 'pkg/cli/data/models.json'
      - 'scripts/**/*.js'
      - 'scripts/check-cgo-cjs-workflow-purity.sh'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cjs.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'actions/setup/js/**'
      - 'actions/setup/md/**'
      - 'pkg/cli/data/models.json'
      - 'scripts/**/*.js'
      - 'scripts/check-cgo-cjs-workflow-purity.sh'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cjs.yml'
  workflow_dispatch:

jobs:
  checkout-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify CGO/CJS workflow purity
        run: bash scripts/check-cgo-cjs-workflow-purity.sh
      - name: Cache repository checkout
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .
          # Keep reservations and cleanup isolated from other runs of this commit.
          key: checkout-cjs-${{ github.run_id }}-${{ github.sha }}

  js-typecheck:
    needs: [checkout-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.ref }}-js-typecheck
      cancel-in-progress: true
    steps:
      - name: Restore checkout
        id: restore-checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .
          key: checkout-cjs-${{ github.run_id }}-${{ github.sha }}
      - name: Checkout on cache miss
        if: steps.restore-checkout.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: actions/setup/js/package-lock.json
      - name: Report Node cache status
        run: |
          if [ "${{ steps.setup-node.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Node cache hit" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Node cache miss" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Install npm dependencies
        run: cd actions/setup/js && npm ci

      - name: Check runtime CJS syntax
        run: make check-cjs-syntax

      - name: Run typecheck
        run: cd actions/setup/js && npm run typecheck

  otlp-protobuf:
    name: OTLP protobuf SDK compatibility
    needs: [checkout-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.ref }}-otlp-protobuf
      cancel-in-progress: true
    steps:
      - name: Restore checkout
        id: restore-checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .
          key: checkout-cjs-${{ github.run_id }}-${{ github.sha }}
      - name: Checkout on cache miss
        if: steps.restore-checkout.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Install isolated Node.js OpenTelemetry SDK
        run: |
          npm install --prefix "$RUNNER_TEMP/otel-protobuf-sdk" --no-audit --no-fund --ignore-scripts --package-lock=false \
            @opentelemetry/sdk-trace-base@2.2.0 @opentelemetry/otlp-transformer@0.208.0 \
            @opentelemetry/resources@2.2.0 @opentelemetry/api@1.9.0
      - name: Compare minimal OTLP protobuf encoder with Node.js SDK
        env:
          GH_AW_OTEL_SDK_DIR: ${{ runner.temp }}/otel-protobuf-sdk
        run: |
          node --test actions/setup/js/scripts/test_otlp_protobuf.mjs

  js-tests:
    name: JS Tests (shard ${{ matrix.shard }}/8)
    needs: [checkout-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    concurrency:
      group: ci-${{ github.ref }}-js-tests-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - name: Restore checkout
        id: restore-checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .
          key: checkout-cjs-${{ github.run_id }}-${{ github.sha }}
      - name: Checkout on cache miss
        if: steps.restore-checkout.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: actions/setup/js/package-lock.json
      - name: Report Node cache status
        run: |
          if [ "${{ steps.setup-node.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Node cache hit" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Node cache miss" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Install npm dependencies
        run: cd actions/setup/js && npm ci
      - name: Setup prompt templates for tests
        run: |
          mkdir -p ${{ runner.temp }}/gh-aw/prompts
          cp actions/setup/md/*.md ${{ runner.temp }}/gh-aw/prompts/
      - name: Run tests
        # Keep no-file-parallelism so Vitest sharding has deterministic test scheduling per shard.
        run: cd actions/setup/js && npm run test:js -- --no-file-parallelism --shard=${{ matrix.shard }}/8

  impacted-js-tests:
    needs: [checkout-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.ref }}-impacted-js-tests
      cancel-in-progress: true
    steps:
      - name: Restore checkout
        id: restore-checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .
          key: checkout-cjs-${{ github.run_id }}-${{ github.sha }}
      - name: Checkout on cache miss
        if: steps.restore-checkout.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: actions/setup/js/package-lock.json
      - name: Run impacted JavaScript unit tests
        run: make test-impacted-js BASE_REF=HEAD^

  docker-root-owned-cleanup:
    name: Docker root-owned staging cleanup
    needs: [checkout-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.ref }}-docker-root-owned-cleanup
      cancel-in-progress: true
    env:
      GH_AW_TEST_DOCKER_IMAGE: alpine:3.21@sha256:2d8a11041a92082ba21e364dec73559ce44f1de69b60fa68315f6d3774e59117
    steps:
      - name: Restore checkout
        id: restore-checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .
          key: checkout-cjs-${{ github.run_id }}-${{ github.sha }}
      - name: Checkout on cache miss
        if: steps.restore-checkout.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Ensure runner is unprivileged
        run: test "$(id -u)" -ne 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Install npm dependencies
        run: cd actions/setup/js && npm ci
      - name: Preload pinned Docker fixture
        run: docker pull "$GH_AW_TEST_DOCKER_IMAGE"
      - name: Run root-owned cleanup regression
        run: cd actions/setup/js && npm run test:js -- --no-file-parallelism release_staging.test.cjs

  lint-js:
    needs: [checkout-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.ref }}-lint-js
      cancel-in-progress: true
    steps:
      - name: Restore checkout
        id: restore-checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .
          key: checkout-cjs-${{ github.run_id }}-${{ github.sha }}
      - name: Checkout on cache miss
        if: steps.restore-checkout.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: actions/setup/js/package-lock.json

      - name: Report Node cache status
        run: |
          if [ "${{ steps.setup-node.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Node cache hit" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Node cache miss" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Install npm dependencies
        run: cd actions/setup/js && npm ci

      - name: Lint JavaScript files
        run: make lint-cjs

      - name: Check JSON formatting
        run: make fmt-check-json

      - name: Validate models.json mirror consistency
        run: make validate-models-json-sync

  artifact-integration:
    name: Artifact API Integration
    needs: [checkout-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ci-${{ github.ref }}-artifact-integration
      cancel-in-progress: true
    steps:
      - name: Restore checkout
        id: restore-checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .
          key: checkout-cjs-${{ github.run_id }}-${{ github.sha }}
      - name: Checkout on cache miss
        if: steps.restore-checkout.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: actions/setup/js/package-lock.json
      - name: Report Node cache status
        run: |
          if [ "${{ steps.setup-node.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Node cache hit" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Node cache miss" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Install npm dependencies
        run: cd actions/setup/js && npm ci
      - name: Run artifact API integration tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd actions/setup/js && npm run test:js-integration-artifact

  decisions-integration:
    name: Copilot Decisions API Integration
    needs: [checkout-cache]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    concurrency:
      group: ci-${{ github.ref }}-decisions-integration
      cancel-in-progress: true
    steps:
      - name: Restore checkout
        id: restore-checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .
          key: checkout-cjs-${{ github.run_id }}-${{ github.sha }}
      - name: Checkout on cache miss
        if: steps.restore-checkout.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Run live Decisions client integration test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --test actions/setup/js/scripts/test_decisions_client.cjs

  nvx-musl-integration:
    name: NVX musl inference integration
    needs: [checkout-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.ref }}-nvx-musl-integration
      cancel-in-progress: true
    steps:
      - name: Restore checkout
        id: restore-checkout
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .
          key: checkout-cjs-${{ github.run_id }}-${{ github.sha }}
      - name: Checkout on cache miss
        if: steps.restore-checkout.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install patchelf
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf
      - name: Run the NVX musl inference integration test
        run: go test -tags=integration ./pkg/workflow -count=1 -run '^TestNVXStagedMuslCopilotInvokesAPIProxy$'

  cleanup-cache:
    name: Cleanup checkout cache
    needs:
      - checkout-cache
      - js-typecheck
      - otlp-protobuf
      - js-tests
      - impacted-js-tests
      - docker-root-owned-cleanup
      - lint-js
      - artifact-integration
      - decisions-integration
      - nvx-musl-integration
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete checkout cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: checkout-cjs-${{ github.run_id }}-${{ github.sha }}
        run: |
          cache_id=$(gh cache list --key "$CACHE_KEY" --ref "$GITHUB_REF" --limit 1 --json id,key --jq '.[] | select(.key == env.CACHE_KEY) | .id')
          if [ -n "$cache_id" ]; then
            gh cache delete "$cache_id"
          fi
