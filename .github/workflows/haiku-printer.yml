name: Haiku Printer
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to print'
        type: string
        required: true
permissions:
  contents: read
jobs:
  print-message:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          echo "📨 Received message:"
          printf '%s\n' "$MESSAGE"
          echo ""
          {
            echo "### 📨 Message"
            echo ""
            printf '%s\n' "$MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"
