apiVersion: github.com/gh-aw/connectors/v1
kind: ConnectorSpec
id: atlassian.com/jira-cloud
endpoints:
  site: https://example.atlassian.net
credentials:
  mcp-service-account:
    phase: agent
    header: Authorization
    scheme: bearer
    scopes: [read:jira:agent-interface, search:jira:agent-interface]
  mcp-personal:
    phase: agent
    header: Authorization
    scheme: basic
    scopes: [read:jira:agent-interface, search:jira:agent-interface]
  rest-writer:
    phase: safe-output
    header: Authorization
    scheme: basic
    scopes: [write:jira-work]
  context-reader:
    phase: context
    header: Authorization
    scheme: basic
    scopes: [read:jira-work]
triggers:
  issue-created:
    verificationProfile: atlassian.com/jira-admin-hmac-sha256
    nativeEvents: [jira:issue_created]
    types:
      /webhookEvent: string
      /issue/id: string
      /issue/key: string
      /issue/self: string
      /issue/fields/project/key: string
    match:
      /webhookEvent: jira:issue_created
      /issue/fields/project/key: APP
      /issue/self: https://example.atlassian.net/rest/api/3/issue/10001
    resources:
      /issue/id: issue-ids
      /issue/fields/project/key: projects
    normalize:
      issue-id: /issue/id
      issue-key: /issue/key
      project: /issue/fields/project/key
      url: /issue/self
  issue-updated:
    verificationProfile: atlassian.com/jira-admin-hmac-sha256
    nativeEvents: [jira:issue_updated]
    types:
      /webhookEvent: string
      /issue/id: string
      /issue/key: string
      /issue/self: string
      /issue/fields/project/key: string
    match:
      /webhookEvent: jira:issue_updated
      /issue/fields/project/key: APP
      /issue/self: https://example.atlassian.net/rest/api/3/issue/10001
    resources:
      /issue/id: issue-ids
      /issue/fields/project/key: projects
    normalize:
      issue-id: /issue/id
      issue-key: /issue/key
      project: /issue/fields/project/key
      url: /issue/self
  issue-deleted:
    verificationProfile: atlassian.com/jira-admin-hmac-sha256
    nativeEvents: [jira:issue_deleted]
    types:
      /webhookEvent: string
      /issue/id: string
      /issue/key: string
      /issue/self: string
      /issue/fields/project/key: string
    match:
      /webhookEvent: jira:issue_deleted
      /issue/fields/project/key: APP
      /issue/self: https://example.atlassian.net/rest/api/3/issue/10001
    resources:
      /issue/id: issue-ids
      /issue/fields/project/key: projects
    normalize:
      issue-id: /issue/id
      issue-key: /issue/key
      project: /issue/fields/project/key
      url: /issue/self
httpMcp:
  service-account:
    url: https://mcp.atlassian.com/v2/mcp
    credential: mcp-service-account
    readOnly: true
    maxResponseBytes: 65536
    tools: &jira-read-tools
      getJiraIssue:
        inputs:
          cloudId: {type: string, required: true, maxLength: 80}
          issueIdOrKey: {type: string, required: true, maxLength: 80, pattern: "^[A-Z][A-Z0-9_]*-[1-9][0-9]*$"}
        resources: {cloudId: cloud-ids, issueIdOrKey: issues}
      searchJiraIssuesUsingJql:
        inputs:
          cloudId: {type: string, required: true, maxLength: 80}
          jql: {type: string, required: true, maxLength: 1000}
          maxResults: {type: integer, required: true, minimum: 1, maximum: 25}
        resources: {cloudId: cloud-ids, jql: queries}
  personal:
    url: https://mcp.atlassian.com/v2/mcp
    credential: mcp-personal
    readOnly: true
    maxResponseBytes: 65536
    tools: *jira-read-tools
safeOutputs:
  create-issue:
    credential: rest-writer
    inputs:
      project: {type: string, required: true, maxLength: 80}
      issue-type: {type: string, required: true, maxLength: 80, enum: [Task]}
      summary: {type: string, required: true, maxLength: 255, pattern: "\\S"}
      description: {type: string, required: true, maxLength: 32767, pattern: "\\S"}
    resources: {project: projects}
    request:
      endpoint: site
      method: POST
      path: /rest/api/3/issue
      body:
        fields:
          object:
            project: {object: {key: {input: project}}}
            issuetype: {object: {name: {input: issue-type}}}
            summary: {input: summary}
            description: {input: description, encoding: jira-adf}
    maxResponseBytes: 16384
    responseRequired: [/id, /key, /self]
    responseTypes: {/id: string, /key: string, /self: string}
    project: {issue-id: /id, issue-key: /key, url: /self}
  update-issue:
    credential: rest-writer
    inputs:
      issue: {type: string, required: true, maxLength: 80, pattern: "^[A-Z][A-Z0-9_]*-[1-9][0-9]*$"}
      summary: {type: string, required: true, maxLength: 255, pattern: "\\S"}
      description: {type: string, required: true, maxLength: 32767, pattern: "\\S"}
    resources: {issue: issues}
    request:
      endpoint: site
      method: PUT
      path: /rest/api/3/issue/{issue}
      pathInputs: {issue: issue}
      body:
        fields:
          object:
            summary: {input: summary}
            description: {input: description, encoding: jira-adf}
    maxResponseBytes: 16384
  add-comment:
    credential: rest-writer
    inputs:
      issue: {type: string, required: true, maxLength: 80, pattern: "^[A-Z][A-Z0-9_]*-[1-9][0-9]*$"}
      text: {type: string, required: true, maxLength: 32767, pattern: "\\S"}
    resources: {issue: issues}
    request:
      endpoint: site
      method: POST
      path: /rest/api/3/issue/{issue}/comment
      pathInputs: {issue: issue}
      body:
        body: {input: text, encoding: jira-adf}
    maxResponseBytes: 16384
    responseRequired: [/id]
    responseTypes: {/id: string}
    project: {comment-id: /id}
  add-label:
    credential: rest-writer
    inputs:
      issue: {type: string, required: true, maxLength: 80, pattern: "^[A-Z][A-Z0-9_]*-[1-9][0-9]*$"}
      label: {type: string, required: true, maxLength: 255, pattern: "^[A-Za-z0-9_.-]+$"}
    resources: {issue: issues}
    request:
      endpoint: site
      method: PUT
      path: /rest/api/3/issue/{issue}
      pathInputs: {issue: issue}
      body:
        update:
          object:
            labels:
              array:
                - object:
                    add: {input: label}
    maxResponseBytes: 16384
context:
  issue-details:
    credential: context-reader
    inputs:
      issue: {type: string, required: true, maxLength: 80, pattern: "^[A-Z][A-Z0-9_]*-[1-9][0-9]*$"}
    resources: {issue: issues}
    request:
      endpoint: site
      method: GET
      path: /rest/api/3/issue/{issue}
      pathInputs: {issue: issue}
      query:
        fields: {literal: "summary,project,labels,status"}
    maxResponseBytes: 65536
    responseResources:
      /id: issue-ids
      /key: issues
      /self: issue-urls
      /fields/project/key: projects
    responseRequired: [/id, /key, /self, /fields/project/key, /fields/summary]
    responseInputs: {/key: issue}
    responseTypes:
      /id: string
      /key: string
      /self: string
      /fields/project/key: string
      /fields/summary: string
      /fields/status/name: string
    project:
      issue-id: /id
      issue-key: /key
      url: /self
      project: /fields/project/key
      summary: /fields/summary
      labels: /fields/labels
      status: /fields/status/name
