apiVersion: github.com/gh-aw/connectors/v1
kind: ConnectorSpec
id: slack.com/threads
endpoints:
  api: https://slack.com
credentials:
  reader:
    phase: agent
    header: Authorization
    scheme: bearer
    scopes: [channels:history]
  context-reader:
    phase: context
    header: Authorization
    scheme: bearer
    scopes: [channels:history]
  writer:
    phase: safe-output
    header: Authorization
    scheme: bearer
    scopes: [chat:write]
triggers:
  threaded-app-mention:
    verificationProfile: slack.com/events-v0
    nativeEvents: [app_mention]
    types:
      /event/ts: string
      /event/thread_ts: string
    resources:
      /team_id: workspaces
      /api_app_id: apps
      /event/channel: channels
      /event/thread_ts: threads
    match:
      /type: event_callback
      /event/type: app_mention
      /team_id: T123ABC456
      /api_app_id: A123ABC456
      /event/channel: C123ABC456
    normalize:
      delivery-id: /event_id
      workspace-id: /team_id
      channel-id: /event/channel
      message-id: /event/ts
      thread-id: /event/thread_ts
      author-id: /event/user
mcp:
  read-thread:
    tool: read-thread
    credential: reader
    inputs:
      channel: {type: string, required: true, maxLength: 80, enum: [C123ABC456]}
      thread: {type: string, required: true, maxLength: 40, pattern: '^[0-9]{10,20}\.[0-9]{6}$'}
    resources: {channel: channels, thread: threads}
    request:
      endpoint: api
      method: GET
      path: /api/conversations.replies
      query:
        channel: {input: channel}
        ts: {input: thread}
        limit: {literal: 15}
    maxResponseBytes: 65536
    responseChecks: {/ok: true, /has_more: false}
    responseRequired: [/messages/0/ts]
    responseResources: {/messages/0/ts: threads}
    responseTypes: {/messages/0/ts: string, /has_more: boolean}
    responseInputs: {/messages/0/ts: thread}
    project: {messages: /messages, has-more: /has_more}
safeOutputs:
  reply-in-thread:
    credential: writer
    inputs:
      channel: {type: string, required: true, maxLength: 80, enum: [C123ABC456]}
      thread: {type: string, required: true, maxLength: 40, pattern: '^[0-9]{10,20}\.[0-9]{6}$'}
      text: {type: string, required: true, maxLength: 4000}
    resources: {channel: channels, thread: threads}
    request:
      endpoint: api
      method: POST
      path: /api/chat.postMessage
      body:
        channel: {input: channel}
        thread_ts: {input: thread}
        text: {input: text}
        reply_broadcast: {literal: false}
        unfurl_links: {literal: false}
        unfurl_media: {literal: false}
        mrkdwn: {literal: false}
        parse: {literal: none}
    maxResponseBytes: 65536
    responseChecks: {/ok: true}
    responseRequired: [/channel, /ts, /message/thread_ts]
    responseResources: {/channel: channels, /message/thread_ts: threads}
    responseTypes: {/channel: string, /ts: string, /message/thread_ts: string}
    responseInputs: {/channel: channel, /message/thread_ts: thread}
    project: {channel: /channel, message-id: /ts, thread-id: /message/thread_ts}
context:
  thread-context:
    credential: context-reader
    inputs:
      channel: {type: string, required: true, maxLength: 80, enum: [C123ABC456]}
      thread: {type: string, required: true, maxLength: 40, pattern: '^[0-9]{10,20}\.[0-9]{6}$'}
    resources: {channel: channels, thread: threads}
    request:
      endpoint: api
      method: GET
      path: /api/conversations.replies
      query:
        channel: {input: channel}
        ts: {input: thread}
        limit: {literal: 15}
    maxResponseBytes: 65536
    responseChecks: {/ok: true, /has_more: false}
    responseRequired: [/messages/0/ts]
    responseResources: {/messages/0/ts: threads}
    responseTypes: {/messages/0/ts: string, /has_more: boolean}
    responseInputs: {/messages/0/ts: thread}
    project: {messages: /messages, has-more: /has_more}
