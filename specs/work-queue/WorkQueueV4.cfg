\* Work queue protocol v4: 2 Work, max 2 attempts, 4 dispatch slots
\* (= Works x MaxAttempts, one run id per Dispatch), 2 run attempts per run,
\* one pool with concurrency 2.
CONSTANTS
    Works = {w1, w2}
    NoWork = NoWork
    DispatchSlots = 4
    Concurrency = 2
    MaxAttempts = 2
    MaxRunAttempts = 2

SPECIFICATION Spec

\* Settled queues stop; a final state with no enabled action is expected.
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    OneOpenClaimPerWork
    BoundRunOwnsCompletion
    CapacityBound
    AttemptsBound

PROPERTIES
    AttemptsMonotone
    NoReopenCompleted
    ReservedReleaseAwaitsDispatcher
    EventualSettlement
