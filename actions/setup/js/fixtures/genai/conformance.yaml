runner: genai-conformance
instrumented_library: gh-aw
instrumentation_library: gh-aw
otlp_protocol: http/protobuf
weaver:
  registry: ${GH_AW_GENAI_REGISTRY}
  config: weaver.toml

scenarios:
  agent_success_latest:
    run: "node agent-run.cjs success latest"
    spans:
      - match:
          attributes:
            gh-aw.job.name: agent
        expect:
          count: 3
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
          attributes:
            gen_ai.agent.name: OpenTelemetry GenAI Conformance
            gen_ai.provider.name: github
            error.type: { present: false }
          instrumentation_scope:
            name: gh-aw
            schema_url: https://opentelemetry.io/schemas/1.45.0
    metrics:
      - gh_aw.job.duration
      - gh_aw.run.duration
      - gh_aw.tokens.input
      - gh_aw.tokens.output
      - gh_aw.tokens.cache_read
      - gh_aw.tokens.cache_write
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.cache_write.input_tokens
      - gen_ai.invoke_agent.duration
    events: []

  agent_failure_latest:
    run: "node agent-run.cjs failure latest"
    spans:
      - match:
          attributes:
            gh-aw.job.name: agent
        expect:
          count: 3
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
          attributes:
            gen_ai.agent.name: OpenTelemetry GenAI Conformance
            gen_ai.provider.name: github
            error.type: agent_failed
          instrumentation_scope:
            name: gh-aw
            schema_url: https://opentelemetry.io/schemas/1.45.0
    metrics:
      - gh_aw.job.duration
      - gh_aw.run.duration
      - gh_aw.job.errors
      - gh_aw.run.errors
      - gh_aw.tokens.input
      - gh_aw.tokens.output
      - gh_aw.tokens.cache_read
      - gh_aw.tokens.cache_write
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.cache_write.input_tokens
      - gen_ai.invoke_agent.duration
    events: []

  agent_success_compat:
    run: "node agent-run.cjs success compat"
    expected_violations:
      - id: span_status_ok_set_by_instrumentation
        reason: Compatibility mode retains the shipped successful span status.
      - id: instrumentation_scope_schema_url_missing
        reason: Compatibility mode retains the shipped instrumentation scope.
      - id: genai_span_name_format
        reason: Compatibility mode retains the shipped gh-aw agent span name.
      - id: genai_expected_attribute_missing
        reason: Compatibility mode retains the shipped client span attributes.
      - id: missing_attribute
        context:
          attribute_key: gen_ai.usage.total_tokens
        reason: Compatibility mode retains the removed total-token attribute (§6.7.1).
      - id: missing_metric
        context: {}
        reason: Compatibility mode retains gen_ai.client.token.usage; check_genai_conformance.mjs rejects any other missing metric.
      - id: deprecated
        context:
          attribute_key: deployment.environment
          deprecation_reason: renamed
          deprecation_note: Replaced by `deployment.environment.name`.
        reason: Compatibility mode retains the shipped resource alias (§8.1).
      - id: deprecated
        context:
          attribute_key: gen_ai.system
          deprecation_reason: uncategorized
          deprecation_note: |
            Replaced by `gen_ai.provider.name`, which has moved to the [OpenTelemetry GenAI semantic conventions repository](https://github.com/open-telemetry/semantic-conventions-genai).
        reason: Compatibility mode retains the shipped provider alias (§6.7.1).
      - id: deprecated
        context:
          attribute_key: gen_ai.workflow.name
          deprecation_reason: uncategorized
          deprecation_note: &moved_to_genai |
            Moved to the [OpenTelemetry GenAI semantic conventions repository](https://github.com/open-telemetry/semantic-conventions-genai).
        reason: Compatibility mode retains the shipped agent-name alias (§6.7.1).
      - id: deprecated
        context:
          attribute_key: gen_ai.usage.cache_creation.input_tokens
          deprecation_reason: uncategorized
          deprecation_note: *moved_to_genai
        reason: Compatibility mode retains the shipped cache-write alias (§6.7.1).
      - id: deprecated
        context:
          attribute_key: gen_ai.token.type
          deprecation_reason: uncategorized
          deprecation_note: *moved_to_genai
        reason: Compatibility mode retains the shipped token metric dimension (§6.7.1).
    spans:
      - match:
          attributes:
            gh-aw.job.name: agent
        expect:
          count: 3
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 2
          attributes:
            gen_ai.agent.name: OpenTelemetry GenAI Conformance
            gen_ai.provider.name: github
            error.type: { present: false }
    metrics:
      - gh_aw.job.duration
      - gh_aw.run.duration
      - gh_aw.tokens.input
      - gh_aw.tokens.output
      - gh_aw.tokens.cache_read
      - gh_aw.tokens.cache_write
      - gen_ai.client.token.usage
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.cache_write.input_tokens
      - gen_ai.invoke_agent.duration
    events: []
