runner: genai-conformance
instrumented_library: gh-aw
instrumentation_library: gh-aw
otlp_protocol: http/protobuf
weaver:
  registry: https://github.com/open-telemetry/semantic-conventions-genai.git@e6658f1[model]

scenarios:
  agent_success_latest:
    run: "node agent-run.cjs success latest"
    spans:
      - match:
          attributes:
            gh-aw.job.name: agent
        expect:
          count: 3
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
          attributes:
            gen_ai.agent.name: OpenTelemetry GenAI Conformance
            gen_ai.provider.name: github
            error.type: { present: false }
          instrumentation_scope:
            name: gh-aw
            schema_url: https://opentelemetry.io/schemas/1.45.0
    metrics:
      - gh_aw.job.duration
      - gh_aw.run.duration
      - gh_aw.tokens.input
      - gh_aw.tokens.output
      - gh_aw.tokens.cache_read
      - gh_aw.tokens.cache_write
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.cache_write.input_tokens
      - gen_ai.invoke_agent.duration
    events: []

  agent_failure_latest:
    run: "node agent-run.cjs failure latest"
    spans:
      - match:
          attributes:
            gh-aw.job.name: agent
        expect:
          count: 3
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
          attributes:
            gen_ai.agent.name: OpenTelemetry GenAI Conformance
            gen_ai.provider.name: github
            error.type: agent_failed
          instrumentation_scope:
            name: gh-aw
            schema_url: https://opentelemetry.io/schemas/1.45.0
    metrics:
      - gh_aw.job.duration
      - gh_aw.run.duration
      - gh_aw.job.errors
      - gh_aw.run.errors
      - gh_aw.tokens.input
      - gh_aw.tokens.output
      - gh_aw.tokens.cache_read
      - gh_aw.tokens.cache_write
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.cache_write.input_tokens
      - gen_ai.invoke_agent.duration
    events: []

  agent_success_compat:
    run: "node agent-run.cjs success compat"
    expected_violations:
      - id: span_status_ok_set_by_instrumentation
        reason: Compatibility mode retains the shipped successful span status.
      - id: instrumentation_scope_schema_url_missing
        reason: Compatibility mode retains the shipped instrumentation scope.
      - id: genai_span_name_format
        reason: Compatibility mode retains the shipped gh-aw agent span name.
      - id: genai_expected_attribute_missing
        reason: Compatibility mode retains the shipped client span attributes.
      - id: missing_attribute
        reason: Compatibility mode retains GitHub, gh-aw, and legacy attributes outside the GenAI registry.
      - id: missing_metric
        reason: Compatibility mode retains gh-aw metrics outside the GenAI registry.
    spans:
      - match:
          attributes:
            gh-aw.job.name: agent
        expect:
          count: 3
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 2
          attributes:
            gen_ai.agent.name: OpenTelemetry GenAI Conformance
            gen_ai.provider.name: github
            error.type: { present: false }
    metrics:
      - gh_aw.job.duration
      - gh_aw.run.duration
      - gh_aw.tokens.input
      - gh_aw.tokens.output
      - gh_aw.tokens.cache_read
      - gh_aw.tokens.cache_write
      - gen_ai.client.token.usage
      - gen_ai.client.inference.usage.input_tokens
      - gen_ai.client.inference.usage.output_tokens
      - gen_ai.client.inference.usage.cache_read.input_tokens
      - gen_ai.client.inference.usage.cache_write.input_tokens
      - gen_ai.invoke_agent.duration
    events: []
