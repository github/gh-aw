apiVersion: github.com/gh-aw/connectors/v1
kind: ConnectorSpec
id: microsoft.com/teams
endpoints:
  graph: https://graph.microsoft.com
  bot: https://smba.trafficmanager.net
credentials:
  reader:
    phase: agent
    header: Authorization
    scheme: bearer
    scopes: [ChannelMessage.Read.Group]
  context-reader:
    phase: context
    header: Authorization
    scheme: bearer
    scopes: [ChannelMessage.Read.Group]
  bot-writer:
    phase: safe-output
    header: Authorization
    scheme: bearer
    scopes: [https://api.botframework.com/.default]
triggers:
  channel-message-created:
    verificationProfile: microsoft.com/graph-basic-channel-notification
    nativeEvents: [created]
    match:
      /changeType: created
      /resourceData/@odata.type: "#Microsoft.Graph.chatMessage"
    resources:
      /tenantId: tenants
      /subscriptionId: subscriptions
      /resource: notification-resources
      /resourceData/id: threads
    normalize:
      subject: /resourceData/id
      tenant: /tenantId
      subscription: /subscriptionId
      resource: /resource
mcp:
  get-channel-message:
    tool: get-channel-message
    credential: reader
    inputs:
      team: {type: string, required: true, maxLength: 36}
      channel: {type: string, required: true, maxLength: 256}
      thread: {type: string, required: true, maxLength: 128}
    resources: {team: teams, channel: channels, thread: threads}
    request:
      endpoint: graph
      method: GET
      path: /v1.0/teams/{team}/channels/{channel}/messages/{thread}
      pathInputs: {team: team, channel: channel, thread: thread}
    maxResponseBytes: 65536
    responseChecks: {/messageType: message, /replyToId: null}
    responseRequired: [/id, /from/user/id, /body/content]
    responseResources:
      /id: threads
      /channelIdentity/teamId: teams
      /channelIdentity/channelId: channels
    project:
      id: /id
      text: /body/content
      content-type: /body/contentType
      author: /from/user/id
      team: /channelIdentity/teamId
      channel: /channelIdentity/channelId
  list-channel-replies:
    tool: list-channel-replies
    credential: reader
    inputs:
      team: {type: string, required: true, maxLength: 36}
      channel: {type: string, required: true, maxLength: 256}
      thread: {type: string, required: true, maxLength: 128}
    resources: {team: teams, channel: channels, thread: threads}
    request:
      endpoint: graph
      method: GET
      path: /v1.0/teams/{team}/channels/{channel}/messages/{thread}/replies
      pathInputs: {team: team, channel: channel, thread: thread}
      query:
        $top: {literal: 20}
    maxResponseBytes: 65536
    responseRequired: [/value]
    project: {replies: /value}
safeOutputs:
  reply-to-activity:
    credential: bot-writer
    inputs:
      conversation: {type: string, required: true, maxLength: 512}
      activity: {type: string, required: true, maxLength: 128}
      text: {type: string, required: true, maxLength: 4000}
    resources: {conversation: conversations, activity: activities}
    request:
      endpoint: bot
      method: POST
      path: /teams/v3/conversations/{conversation}/activities/{activity}
      pathInputs: {conversation: conversation, activity: activity}
      body:
        type: {literal: message}
        text: {input: text}
        replyToId: {input: activity}
    maxResponseBytes: 16384
    responseRequired: [/id]
    project: {id: /id}
  reply-with-review-card:
    credential: bot-writer
    inputs:
      conversation: {type: string, required: true, maxLength: 512}
      activity: {type: string, required: true, maxLength: 128}
      text: {type: string, required: true, maxLength: 4000}
    resources: {conversation: conversations, activity: activities}
    request:
      endpoint: bot
      method: POST
      path: /teams/v3/conversations/{conversation}/activities/{activity}
      pathInputs: {conversation: conversation, activity: activity}
      body:
        type: {literal: message}
        text: {input: text}
        replyToId: {input: activity}
        attachments:
          literal:
            - contentType: application/vnd.microsoft.card.adaptive
              content:
                $schema: http://adaptivecards.io/schemas/adaptive-card.json
                type: AdaptiveCard
                version: "1.2"
                body:
                  - type: TextBlock
                    text: Agentic workflow review
                    wrap: true
    maxResponseBytes: 16384
    responseRequired: [/id]
    project: {id: /id}
context:
  channel-thread-root:
    credential: context-reader
    inputs:
      team: {type: string, required: true, maxLength: 36}
      channel: {type: string, required: true, maxLength: 256}
      thread: {type: string, required: true, maxLength: 128}
    resources: {team: teams, channel: channels, thread: threads}
    request:
      endpoint: graph
      method: GET
      path: /v1.0/teams/{team}/channels/{channel}/messages/{thread}
      pathInputs: {team: team, channel: channel, thread: thread}
    maxResponseBytes: 65536
    responseChecks: {/messageType: message, /replyToId: null}
    responseRequired: [/id, /from/user/id, /body/content]
    responseResources:
      /id: threads
      /channelIdentity/teamId: teams
      /channelIdentity/channelId: channels
    project:
      id: /id
      text: /body/content
      content-type: /body/contentType
      author: /from/user/id
      team: /channelIdentity/teamId
      channel: /channelIdentity/channelId
  channel-thread-replies:
    credential: context-reader
    inputs:
      team: {type: string, required: true, maxLength: 36}
      channel: {type: string, required: true, maxLength: 256}
      thread: {type: string, required: true, maxLength: 128}
    resources: {team: teams, channel: channels, thread: threads}
    request:
      endpoint: graph
      method: GET
      path: /v1.0/teams/{team}/channels/{channel}/messages/{thread}/replies
      pathInputs: {team: team, channel: channel, thread: thread}
      query:
        $top: {literal: 20}
    maxResponseBytes: 65536
    responseRequired: [/value]
    project: {replies: /value}
