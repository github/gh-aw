apiVersion: github.com/gh-aw/connectors/v1
kind: ConnectorSpec
id: example.com/issues
endpoints:
  api: https://api.example.com
credentials:
  reader:
    phase: agent
    header: Authorization
    scheme: bearer
    scopes: [issues:read]
  writer:
    phase: safe-output
    header: Authorization
    scheme: bearer
    scopes: [comments:write]
  context-reader:
    phase: context
    header: Authorization
    scheme: bearer
    scopes: [issues:read]
triggers:
  issue-created:
    verificationProfile: example.com/hmac-sha256
    nativeEvents: [issue.created]
    match:
      /event: issue.created
    normalize:
      subject: /issue/id
      title: /issue/title
mcp:
  get-issue:
    tool: get-issue
    credential: reader
    inputs:
      issue: {type: string, required: true, maxLength: 80}
    resources: {issue: issues}
    request:
      endpoint: api
      method: GET
      path: /issues/{issue}
      pathInputs: {issue: issue}
    maxResponseBytes: 65536
safeOutputs:
  add-comment:
    credential: writer
    inputs:
      issue: {type: string, required: true, maxLength: 80}
      text: {type: string, required: true, maxLength: 4000}
    resources: {issue: issues}
    request:
      endpoint: api
      method: POST
      path: /issues/{issue}/comments
      pathInputs: {issue: issue}
      body:
        body: {input: text}
    maxResponseBytes: 65536
context:
  issue-details:
    credential: context-reader
    inputs:
      issue: {type: string, required: true, maxLength: 80}
    resources: {issue: issues}
    request:
      endpoint: api
      method: GET
      path: /issues/{issue}
      pathInputs: {issue: issue}
    maxResponseBytes: 65536
