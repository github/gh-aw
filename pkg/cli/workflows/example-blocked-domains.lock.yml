name: "Example: Blocked Domains"
"on":
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: Agent caller context (used internally by Agentic Workflows).
        required: false
        type: string

permissions: {}

concurrency:
  group: "gh-aw-${{ github.workflow }}"

run-name: "Example: Blocked Domains"

jobs:
  activation:
    runs-on: ubuntu-slim
    permissions:
      actions: read
