# License allowlist from CONTRIBUTING.md.
require-license: true
require-known-license: true

allow:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC

# Container images excluded from license scanning entirely (glob patterns matched
# against the image reference). This gh-aw specific key is not part of grant's
# policy schema; grant ignores it.
#
# ghcr.io/oraios/serena is the project-maintained Serena MCP image: a Debian
# development image bundling a full Rust toolchain, a Python 3.11 environment,
# Node.js and ~1700 packages. Its cargo registry alone accounts for 566 crates
# that ship no SPDX license metadata, which `require-license: true` reports as
# violations even though the crates are permissively licensed upstream. gh-aw
# runs this image as an MCP server and never links or redistributes any of its
# contents, so per-package exceptions would add hundreds of entries that also
# weaken the policy for every other scanned image. Vulnerability scanning
# (`--grype`) still covers this image.
ignore-images:
  - "ghcr.io/oraios/serena:*"

# Base OS packages of upstream container images that gh-aw executes (Alpine
# variants of the MCP server and runtime images, the Debian-based
# ghcr.io/github/github-mcp-server image, and the Ubuntu 22.04 based
# ghcr.io/github/gh-aw-firewall/agent image) and the Node/npm runtime those
# images ship. These packages are accepted as documented policy exceptions;
# see CONTRIBUTING.md, including the vendored gh-aw-node runtime exception.
# The allowlist above still applies to every other package in those images.
ignore-packages:
  # Alpine base OS
  - alpine-baselayout
  - alpine-baselayout-data
  - apk-tools
  - bash
  - busybox
  - busybox-binsh
  - ca-certificates
  - ca-certificates-bundle
  - catatonit
  - crun
  - fuse-common
  - fuse-overlayfs
  - fuse3
  - fuse3-libs
  - gdbm
  - glib
  - gmp
  - gnupg-dirmngr
  - gnupg-gpgconf
  - gnupg-keyboxd
  - gnutls
  - gpg
  - gpg-agent
  - gpgme
  - gpgsm
  - git
  - git-init-template
  - libapk
  - libassuan
